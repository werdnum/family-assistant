name: CI with Dev Container
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
permissions:
  contents: read
  packages: write
  pull-requests: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-name: ${{ steps.tag.outputs.image }}
    steps:
      - name: Generate image tag
        id: tag
        run: |
          TAG="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:devcontainer-${TAG}" >> $GITHUB_OUTPUT

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_code_changes: ${{ steps.code_changes.outputs.has_code_changes }}
      ast_grep_changes: ${{ steps.filter.outputs.ast_grep_changes }}
      frontend_source: ${{ steps.filter.outputs.frontend_source }}
      frontend_tests: ${{ steps.filter.outputs.frontend_tests }}
      backend_source: ${{ steps.filter.outputs.backend_source }}
      backend_tests_unit: ${{ steps.filter.outputs.backend_tests_unit }}
      backend_tests_playwright: ${{ steps.filter.outputs.backend_tests_playwright }}
      ci_workflow: ${{ steps.filter.outputs.ci_workflow }}
      web_api: ${{ steps.filter.outputs.web_api }}
      dockerfile_changes: ${{ steps.filter.outputs.dockerfile_changes }}
      gemini_client: ${{ steps.filter.outputs.gemini_client }}
      llm_integration: ${{ steps.filter.outputs.llm_integration }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: code_changes
        with:
          # A file counts as a code change only when it falls outside *every*
          # exclusion below. This requires predicate-quantifier: every -- with
          # the default 'some', an all-negated list matches as soon as a file
          # fails any single negation (e.g. an ios/ file still matches
          # '!docs/**'), so the exclusions would never gate anything.
          predicate-quantifier: every
          filters: |
            has_code_changes:
              - '!docs/**'
              - '!*.md'
              - '!ios/**'
              - '!.claude/**'
              - '!.serena/**'
              - '!.ast-grep/**'
              - '!.github/workflows/gemini-*.yml'
              - '!.github/workflows/build-containers.yml'
              - '!.github/workflows/ios-tests.yml'
              - '!.github/dependabot.yml'
              - '!.devcontainer/claude-wrapper.sh'
              - '!.devcontainer/throttle_backspaces.py'
              - '!.devcontainer/setup-workspace.sh'
              - '!.devcontainer/run-claude-isolated.sh'
              - '!.devcontainer/run-oneshot.sh'
              - '!.devcontainer/merge-settings.py'
              - '!.devcontainer/*.md'
              - '!contrib/**'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.markdownlint.json'
              - '!.mdformat.toml'
              - '!aider.yaml'
              - '!.mcp.json'
              - '!mcp_config.dev.json'
              - '!.build'
      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ast_grep_changes:
              - '.ast-grep/**'
            frontend_source:
              - 'frontend/src/**'
              - 'frontend/*.html'
              - 'frontend/*.json'
              - 'frontend/*.js'
              - 'frontend/package*.json'
            frontend_tests:
              - 'frontend/**/*.test.*'
              - 'frontend/**/__tests__/**'
            backend_source:
              - 'src/**/*.py'
            backend_tests_unit:
              - 'tests/**/*.py'
            backend_tests_playwright:
              - 'tests/functional/web/test_*.py'
            ci_workflow:
              - '.github/workflows/ci-*.yml'
            web_api:
              - 'src/family_assistant/web/**/*.py'
            dockerfile_changes:
              - 'Dockerfile'
              - '.devcontainer/Dockerfile'
              - '.devcontainer/Dockerfile.ci'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.txt'
            gemini_client:
              - 'src/family_assistant/llm/providers/google_genai_client.py'
            llm_integration:
              - 'src/family_assistant/llm/**/*.py'
              - 'tests/integration/llm/**/*.py'
              - 'tests/integration/test_google_embedding.py'
              - 'tests/cassettes/llm/**'
              - 'tests/cassettes/gemini/**'
            ios:
              - 'ios/**'
              - '.github/workflows/ios-tests.yml'
              - '.github/workflows/ci-with-devcontainer.yml'
  build-ci-container:
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CI devcontainer image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.image-name }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:devcontainer-main
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-dev
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-ci
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-ci,mode=max
  build-main-container:
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.dockerfile_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build main application image (verification + cache)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:buildcache-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:main
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:buildcache-${{ matrix.arch }},mode=max
  build-devcontainer:
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.dockerfile_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build devcontainer image (verification + cache)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-dev-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-dev
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:devcontainer-main
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-dev-${{ matrix.arch }},mode=max
  lint:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' ||
      needs.detect-changes.outputs.ast_grep_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run linting in devcontainer
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/workspace/main \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              echo "Setting up Python environment..." && \
              uv venv .venv && \
              . .venv/bin/activate && \
              uv sync --extra dev && \
              if [ -d "/opt/frontend/node_modules" ] && [ ! -d "frontend/node_modules" ]; then \
                echo "Symlinking pre-installed node_modules for frontend linting..."; \
                ln -s /opt/frontend/node_modules frontend/node_modules; \
              fi && \
              scripts/format-and-lint.sh'
  test-frontend-unit:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' &&
      (needs.detect-changes.outputs.frontend_source == 'true' ||
       needs.detect-changes.outputs.frontend_tests == 'true' ||
       needs.detect-changes.outputs.ci_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frontend tests in devcontainer
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/workspace/main \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -e CI=true \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              if [ -d "/opt/frontend/node_modules" ] && [ ! -d "frontend/node_modules" ]; then \
                echo "Symlinking pre-installed node_modules for frontend tests..."; \
                ln -s /opt/frontend/node_modules frontend/node_modules; \
              fi && \
              mkdir -p test-results && \
              npm test --prefix frontend -- --run --reporter=json --reporter=verbose --outputFile=test-results/frontend-report.json'
      - name: Upload frontend test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: test-results/frontend-report.json
          retention-days: 7
          if-no-files-found: ignore
  test-backend-sqlite:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' &&
      (needs.detect-changes.outputs.backend_source == 'true' ||
       needs.detect-changes.outputs.backend_tests_unit == 'true' ||
       needs.detect-changes.outputs.ci_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run backend SQLite tests in devcontainer
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/workspace/main \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -e CI=true \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              echo "Setting up Python environment..." && \
              uv venv .venv && \
              . .venv/bin/activate && \
              uv sync --extra dev && \
              if [ -d "/opt/frontend/node_modules" ] && [ ! -d "frontend/node_modules" ]; then \
                echo "Symlinking pre-installed node_modules for backend tests..."; \
                ln -s /opt/frontend/node_modules frontend/node_modules; \
              fi && \
              if [ -d "/opt/frontend-dist" ]; then \
                echo "Copying pre-built frontend assets..."; \
                mkdir -p /workspace/main/src/family_assistant/static/dist; \
                cp -r /opt/frontend-dist/. /workspace/main/src/family_assistant/static/dist/; \
                echo "Frontend assets copied successfully"; \
                ls -la /workspace/main/src/family_assistant/static/dist/; \
              else \
                echo "No pre-built frontend assets found at /opt/frontend-dist"; \
              fi && \
              mkdir -p test-results && \
              .venv/bin/python scripts/run_pytest_adaptive.py -q --timeout=300 --db sqlite -m "not postgres and not playwright and not llm_integration and not gemini_live" \
                --json-report --json-report-file=test-results/backend-sqlite-report.json'
      - name: Summarize backend test results (SQLite)
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("test-results/backend-sqlite-report.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report_path.exists():
              summary_path.write_text(
                  "## Backend SQLite tests\n\nNo pytest JSON report was produced.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report.get("summary", {})
          tests = report.get("tests", [])
          failed_tests = [
              test for test in tests if test.get("outcome") in {"failed", "error"}
          ][:10]

          lines = [
              "## Backend SQLite tests",
              "",
              f"- Exit code: `{report.get('exitcode')}`",
              f"- Collected: `{summary.get('collected', summary.get('total', 0))}`",
              f"- Passed: `{summary.get('passed', 0)}`",
              f"- Failed: `{summary.get('failed', summary.get('failures', 0))}`",
              f"- Errors: `{summary.get('error', summary.get('errors', 0))}`",
              f"- Skipped: `{summary.get('skipped', 0)}`",
              "",
          ]
          if failed_tests:
              lines.append("### First failures")
              lines.extend(
                  f"- `{test.get('nodeid', test.get('name', '<unknown>'))}`"
                  for test in failed_tests
              )

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload backend test results (SQLite)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-artifacts-sqlite-${{ github.run_id }}
          path: test-results/backend-sqlite-report.json
          retention-days: 7
          if-no-files-found: ignore
  test-backend-postgres:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' &&
      (needs.detect-changes.outputs.backend_source == 'true' ||
       needs.detect-changes.outputs.backend_tests_unit == 'true' ||
       needs.detect-changes.outputs.ci_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run backend PostgreSQL tests in devcontainer
        run: |
          docker run \
            --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace/main \
            -e TEST_DATABASE_URL="postgresql://test:test@localhost:5432/test" \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -e CI=true \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              echo "Setting up Python environment..." && \
              uv venv .venv && \
              . .venv/bin/activate && \
              uv sync --extra dev && \
              if [ -d "/opt/frontend/node_modules" ] && [ ! -d "frontend/node_modules" ]; then \
                echo "Symlinking pre-installed node_modules for backend tests..."; \
                ln -s /opt/frontend/node_modules frontend/node_modules; \
              fi && \
              if [ -d "/opt/frontend-dist" ]; then \
                echo "Copying pre-built frontend assets..."; \
                mkdir -p /workspace/main/src/family_assistant/static/dist; \
                cp -r /opt/frontend-dist/. /workspace/main/src/family_assistant/static/dist/; \
                echo "Frontend assets copied successfully"; \
                ls -la /workspace/main/src/family_assistant/static/dist/; \
              else \
                echo "No pre-built frontend assets found at /opt/frontend-dist"; \
              fi && \
              mkdir -p test-results && \
              .venv/bin/python scripts/run_pytest_adaptive.py --postgres -q --timeout=300 -m "not playwright and not llm_integration and not gemini_live" \
                --json-report --json-report-file=test-results/backend-postgres-report.json'
      - name: Summarize backend test results (PostgreSQL)
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("test-results/backend-postgres-report.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report_path.exists():
              summary_path.write_text(
                  "## Backend PostgreSQL tests\n\nNo pytest JSON report was produced.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report.get("summary", {})
          tests = report.get("tests", [])
          failed_tests = [
              test for test in tests if test.get("outcome") in {"failed", "error"}
          ][:10]

          lines = [
              "## Backend PostgreSQL tests",
              "",
              f"- Exit code: `{report.get('exitcode')}`",
              f"- Collected: `{summary.get('collected', summary.get('total', 0))}`",
              f"- Passed: `{summary.get('passed', 0)}`",
              f"- Failed: `{summary.get('failed', summary.get('failures', 0))}`",
              f"- Errors: `{summary.get('error', summary.get('errors', 0))}`",
              f"- Skipped: `{summary.get('skipped', 0)}`",
              "",
          ]
          if failed_tests:
              lines.append("### First failures")
              lines.extend(
                  f"- `{test.get('nodeid', test.get('name', '<unknown>'))}`"
                  for test in failed_tests
              )

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload backend test results (PostgreSQL)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-artifacts-postgres-${{ github.run_id }}
          path: test-results/backend-postgres-report.json
          retention-days: 7
          if-no-files-found: ignore

  test-playwright-sqlite:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' &&
      (needs.detect-changes.outputs.frontend_source == 'true' ||
       needs.detect-changes.outputs.backend_source == 'true' ||
       needs.detect-changes.outputs.web_api == 'true' ||
       needs.detect-changes.outputs.backend_tests_playwright == 'true' ||
       needs.detect-changes.outputs.ci_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Playwright tests with SQLite in devcontainer
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/workspace/main \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -e CI=true \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              echo "Setting up Python environment..." && \
              uv venv .venv && \
              . .venv/bin/activate && \
              uv sync --extra dev && \
              if [ -d "/opt/frontend-dist" ]; then \
                echo "Copying pre-built frontend assets..."; \
                mkdir -p /workspace/main/src/family_assistant/static/dist; \
                cp -r /opt/frontend-dist/. /workspace/main/src/family_assistant/static/dist/; \
                echo "Frontend assets copied successfully"; \
                ls -la /workspace/main/src/family_assistant/static/dist/; \
              else \
                echo "No pre-built frontend assets found at /opt/frontend-dist"; \
              fi && \
              mkdir -p test-results && \
              .venv/bin/pytest tests -q --timeout=300 --db sqlite -m "playwright" \
                --screenshot=on --video=retain-on-failure --tracing=retain-on-failure \
                --json-report --json-report-file=test-results/playwright-sqlite-report.json \
                --output=test-results'
      - name: Upload Playwright test artifacts (SQLite)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-artifacts-sqlite-${{ github.run_id }}
          path: |
            test-results/
            /tmp/history_page_*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Output artifact info
        if: always()
        run: |
          echo "🔍 Debug artifacts uploaded to: playwright-artifacts-sqlite-${{ github.run_id }}"
          echo "📊 JSON test report: test-results/playwright-sqlite-report.json"
          echo "📱 Screenshots: test-results/**/test-failed-*.png"
          echo "🎥 Videos: test-results/**/test-*.webm"
          echo "🕵️ Traces: test-results/**/trace.zip"
          echo ""
          echo "💡 Download with: gh run download ${{ github.run_id }} --name playwright-artifacts-sqlite-${{ github.run_id }}"

  test-playwright-postgres:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' &&
      (needs.detect-changes.outputs.frontend_source == 'true' ||
       needs.detect-changes.outputs.backend_source == 'true' ||
       needs.detect-changes.outputs.web_api == 'true' ||
       needs.detect-changes.outputs.backend_tests_playwright == 'true' ||
       needs.detect-changes.outputs.ci_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Playwright tests with PostgreSQL in devcontainer
        run: |
          docker run \
            --rm \
            --network host \
            -v ${{ github.workspace }}:/workspace/main \
            -e TEST_DATABASE_URL="postgresql://test:test@localhost:5432/test" \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -e CI=true \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              echo "Setting up Python environment..." && \
              uv venv .venv && \
              . .venv/bin/activate && \
              uv sync --extra dev && \
              if [ -d "/opt/frontend-dist" ]; then \
                echo "Copying pre-built frontend assets..."; \
                mkdir -p /workspace/main/src/family_assistant/static/dist; \
                cp -r /opt/frontend-dist/. /workspace/main/src/family_assistant/static/dist/; \
                echo "Frontend assets copied successfully"; \
                ls -la /workspace/main/src/family_assistant/static/dist/; \
              else \
                echo "No pre-built frontend assets found at /opt/frontend-dist"; \
              fi && \
              mkdir -p test-results && \
              .venv/bin/pytest tests --postgres -q --timeout=300 -m "playwright" \
                --screenshot=on --video=retain-on-failure --tracing=retain-on-failure \
                --json-report --json-report-file=test-results/playwright-postgres-report.json \
                --output=test-results'
      - name: Upload Playwright test artifacts (PostgreSQL)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-artifacts-postgres-${{ github.run_id }}
          path: |
            test-results/
            /tmp/history_page_*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Output artifact info
        if: always()
        run: |
          echo "🔍 Debug artifacts uploaded to: playwright-artifacts-postgres-${{ github.run_id }}"
          echo "📊 JSON test report: test-results/playwright-postgres-report.json"
          echo "📱 Screenshots: test-results/**/test-failed-*.png"
          echo "🎥 Videos: test-results/**/test-*.webm"
          echo "🕵️ Traces: test-results/**/trace.zip"
          echo ""
          echo "💡 Download with: gh run download ${{ github.run_id }} --name playwright-artifacts-postgres-${{ github.run_id }}"

  test-gemini-live:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' &&
      needs.detect-changes.outputs.gemini_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Gemini live tests in devcontainer
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/workspace/main \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -e CI=true \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              echo "Setting up Python environment..." && \
              uv venv .venv && \
              . .venv/bin/activate && \
              uv sync --extra dev && \
              mkdir -p test-results && \
              .venv/bin/pytest -q --timeout=300 -m "gemini_live" \
                --json-report --json-report-file=test-results/gemini-live-report.json'
      - name: Upload Gemini live test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gemini-live-test-results-${{ github.run_id }}
          path: test-results/gemini-live-report.json
          retention-days: 7
          if-no-files-found: ignore

  test-llm-integration:
    needs: [prepare, build-ci-container, detect-changes]
    if: |
      needs.detect-changes.outputs.has_code_changes == 'true' &&
      (needs.detect-changes.outputs.backend_source == 'true' ||
       needs.detect-changes.outputs.backend_tests_unit == 'true' ||
       needs.detect-changes.outputs.llm_integration == 'true' ||
       needs.detect-changes.outputs.ci_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Container Registry
        uses: ./.github/actions/docker-login-retry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run LLM integration tests in replay mode
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/workspace/main \
            -e CLAUDE_PROJECT_REPO="" \
            -e UV_CACHE_DIR=/opt/uv-cache \
            -e CI=true \
            -e LLM_RECORD_MODE=replay \
            -u claude \
            ${{ needs.prepare.outputs.image-name }} \
            bash -c 'cd /workspace/main && \
              echo "Setting up Python environment..." && \
              uv venv .venv && \
              . .venv/bin/activate && \
              uv sync --extra dev && \
              mkdir -p test-results && \
              .venv/bin/pytest -q --timeout=300 -m "llm_integration" -o "addopts=" \
                --json-report --json-report-file=test-results/llm-integration-report.json'
      - name: Upload LLM integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llm-integration-test-results-${{ github.run_id }}
          path: test-results/llm-integration-report.json
          retention-days: 7
          if-no-files-found: ignore

  smoke-test-main-image:
    needs: [prepare, detect-changes]
    if: needs.detect-changes.outputs.has_code_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run image smoke test
        uses: ./.github/actions/smoke-test-action
        with:
          image-tag: smoke-test
          registry: ${{ env.REGISTRY }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

  test-ios:
    needs: detect-changes
    if: needs.detect-changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-tests.yml

  # Require all test jobs to pass
  all-tests:
    needs: [lint, test-frontend-unit, test-backend-sqlite, test-backend-postgres, test-playwright-sqlite, test-playwright-postgres, test-gemini-live, test-llm-integration, smoke-test-main-image, test-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all tests passed
        run: |
          # Job results can be: success, failure, cancelled, skipped
          # We fail if any job failed or was cancelled
          # Skipped jobs are OK (means they were intentionally skipped by conditionals)

          function check_job() {
            local job_name=$1
            local job_result=$2

            if [[ "$job_result" == "failure" || "$job_result" == "cancelled" ]]; then
              echo "❌ $job_name: $job_result"
              return 1
            elif [[ "$job_result" == "skipped" ]]; then
              echo "⏭️  $job_name: skipped"
              return 0
            elif [[ "$job_result" == "success" ]]; then
              echo "✅ $job_name: success"
              return 0
            else
              echo "❓ $job_name: unknown status ($job_result)"
              return 1
            fi
          }

          echo "Checking test results..."
          FAILED=0

          check_job "lint" "${{ needs.lint.result }}" || FAILED=1
          check_job "test-frontend-unit" "${{ needs.test-frontend-unit.result }}" || FAILED=1
          check_job "test-backend-sqlite" "${{ needs.test-backend-sqlite.result }}" || FAILED=1
          check_job "test-backend-postgres" "${{ needs.test-backend-postgres.result }}" || FAILED=1
          check_job "test-playwright-sqlite" "${{ needs.test-playwright-sqlite.result }}" || FAILED=1
          check_job "test-playwright-postgres" "${{ needs.test-playwright-postgres.result }}" || FAILED=1
          check_job "test-gemini-live" "${{ needs.test-gemini-live.result }}" || FAILED=1
          check_job "test-llm-integration" "${{ needs.test-llm-integration.result }}" || FAILED=1
          check_job "smoke-test-main-image" "${{ needs.smoke-test-main-image.result }}" || FAILED=1
          check_job "test-ios" "${{ needs.test-ios.result }}" || FAILED=1

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "❌ One or more test jobs failed"
            exit 1
          fi

          echo ""
          echo "✅ All tests passed or were skipped!"

# Note: Test images with unique tags will be cleaned up by GHCR retention policies
