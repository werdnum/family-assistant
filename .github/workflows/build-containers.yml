name: Build and Push Containers
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag for the images (defaults to timestamp)'
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Don't cancel in-progress builds - they take 60+ minutes and frequent commits
  # would prevent any build from completing
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }} # This will be owner/repo format
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      should-push: ${{ steps.tags.outputs.should-push }}
    steps:
      - name: Generate tags and determine build strategy
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(date +%Y%m%d_%H%M%S)
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "should-push=true" >> $GITHUB_OUTPUT
  smoke-test:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run image smoke test
        uses: ./.github/actions/smoke-test-action
        with:
          image-tag: smoke-test
          registry: ${{ env.REGISTRY }}
          image-prefix: ${{ env.IMAGE_PREFIX }}

  build-devcontainer:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        if: needs.prepare.outputs.should-push == 'true'
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push devcontainer image by digest
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }},push-by-digest=true,name-canonical=true,push=${{ needs.prepare.outputs.should-push }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-dev-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-dev
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-devcontainer-dev-${{ matrix.arch }},mode=max
      - name: Export digest
        if: needs.prepare.outputs.should-push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.prepare.outputs.should-push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-devcontainer-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-devcontainer:
    needs: [prepare, build-devcontainer]
    if: needs.prepare.outputs.should-push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-devcontainer-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:devcontainer-${TAG}" \
            -t "${IMAGE}:devcontainer-latest" \
            -t "${IMAGE}:devcontainer-main" \
            $(printf "${IMAGE}@sha256:%s " *)

  build-main:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120 # 2 hours for build
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        if: needs.prepare.outputs.should-push == 'true'
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
      - name: Build and push main application image by digest
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }},push-by-digest=true,name-canonical=true,push=${{ needs.prepare.outputs.should-push }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:buildcache-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:buildcache-${{ matrix.arch }},mode=max
      - name: Export digest
        if: needs.prepare.outputs.should-push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.prepare.outputs.should-push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-main-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-main:
    needs: [prepare, smoke-test, build-main]
    if: needs.prepare.outputs.should-push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-main-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          primary_tag="${IMAGE}:${TAG}"
          docker buildx imagetools create \
            -t "${primary_tag}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:buildcache" \
            $(printf "${IMAGE}@sha256:%s " *)
          manifest_digest=$(docker buildx imagetools inspect "${primary_tag}" --format '{{.Manifest.Digest}}')
          echo "digest=${manifest_digest}" >> $GITHUB_OUTPUT

  update-kube-config:
    needs: [prepare, merge-main]
    if: needs.prepare.outputs.should-push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.IMAGE_UPDATER_APP_ID }}
          private-key: ${{ secrets.IMAGE_UPDATER_PRIVATE_KEY }}
          owner: werdnum
      - name: Update kube-config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_DIGEST: ${{ needs.merge-main.outputs.digest }}
        run: |
          set -e

          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}@${IMAGE_DIGEST}"
          DEPLOYMENT_PATH="kubernetes/manifests/workloads/family-assistant/Deployment-family-assistant.yaml"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/werdnum/kube-config.git" kube-config
          cd kube-config

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          yq eval -i "(.spec.template.spec.containers[] | select(.name == \"family-assistant\") | .image) = \"${NEW_IMAGE}\"" \
            "${DEPLOYMENT_PATH}"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add "${DEPLOYMENT_PATH}"
            git commit -m "chore(family-assistant): update image to ${IMAGE_DIGEST:0:12}

          Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            git push
            echo "Updated kube-config with new image"
          fi

