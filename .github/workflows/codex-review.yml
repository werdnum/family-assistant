name: '🧠 Codex Review'

on:
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'ready_for_review'
      - 'synchronize'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    if: |-
      github.event.pull_request.head.repo.fork == false && !github.event.pull_request.draft
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      final_message: '${{ steps.run_codex.outputs.final-message }}'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6
        with:
          ref: 'refs/pull/${{ github.event.pull_request.number }}/merge'
          fetch-depth: 0

      - name: 'Pre-fetch base and head refs for the pull request'
        env:
          BASE_REF: '${{ github.event.pull_request.base.ref }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: |-
          git fetch --no-tags origin \
            "${BASE_REF}" \
            "+refs/pull/${PR_NUMBER}/head"

      - name: 'Build Codex review prompt'
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          PR_TITLE: '${{ github.event.pull_request.title }}'
          PR_BODY: '${{ github.event.pull_request.body }}'
        run: |-
          {
            echo "This is PR #${PR_NUMBER} for ${GITHUB_REPOSITORY}."
            echo
            echo "Review ONLY the changes introduced by this pull request."
            echo "Focus on correctness issues, regressions, missing tests, and maintainability concerns."
            echo "Keep feedback concise and actionable."
            echo
            echo "Pull request title and body:"
            echo "----"
            echo "${PR_TITLE}"
            echo "${PR_BODY}"
            echo
            echo "Unified diff for this pull request:"
            echo "----"
            git diff --no-color "${BASE_SHA}...${HEAD_SHA}"
          } > '.codex-review-prompt.txt'

      - name: 'Run Codex pull request review'
        id: 'run_codex'
        uses: 'openai/codex-action@v1'
        with:
          openai-api-key: '${{ secrets.OPENAI_API_KEY }}'
          prompt-file: '.codex-review-prompt.txt'

  post_feedback:
    needs: 'review'
    if: |-
      needs.review.outputs.final_message != ''
    runs-on: 'ubuntu-latest'
    permissions:
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Upsert Codex feedback comment'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: '${{ needs.review.outputs.final_message }}'
        with:
          github-token: '${{ github.token }}'
          script: |-
            const marker = '<!-- codex-review-comment -->';
            const body = [
              marker,
              '## 🧠 Codex Review (OpenAI)',
              '',
              process.env.CODEX_FINAL_MESSAGE,
            ].join('\n');

            const issueNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const existingComment = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
