name: Refresh provider model skills

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-provider-model-skills
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Refresh provider model snapshots
        run: python scripts/refresh-provider-model-skills.py

      - name: Open refresh pull request
        env:
          GH_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          if git diff --quiet -- .agents/skills; then
            echo 'Provider model snapshots are current.'
            exit 0
          fi

          branch='automation/provider-model-skills'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add .agents/skills/*/references/current-models.json
          git commit -m 'Refresh provider model skill snapshots'

          remote_sha=$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)
          if [[ -n "${remote_sha}" ]]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              origin "HEAD:${branch}"
          else
            git push origin "HEAD:${branch}"
          fi

          if [[ $(gh pr list --repo "${REPOSITORY}" --head "${branch}" --json number --jq length) -gt 0 ]]; then
            echo 'Updated the existing provider model refresh pull request.'
            exit 0
          fi

          gh pr create \
            --repo "${REPOSITORY}" \
            --base main \
            --head "${branch}" \
            --title 'Refresh provider model skill snapshots' \
            --body 'Automated refresh from the official Gemini, OpenAI, and Anthropic model documentation.'
