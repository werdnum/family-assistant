name: iOS Tests
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # macos-26 (Apple Silicon, Xcode 26.x) is the current GA image. The exact
    # simulator lineup changes with each Xcode release, so the simulator is
    # resolved dynamically below rather than hardcoded to a device name.
    runs-on: macos-26
    # Headroom over the ~9-minute happy path: the UI step can retry failing
    # tests up to 3 iterations, which adds wall-clock time on a slow runner.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios/FamilyAssistant
    env:
      DERIVED_DATA: build/DerivedDataCI
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Select iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          candidates = [
              device
              for runtime, devs in devices.items()
              if 'iOS' in runtime
              for device in devs
              if device.get('isAvailable') and device['name'].startswith('iPhone')
          ]
          print(candidates[0]['udid'] if candidates else '')
          ")
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Boot simulator
        # Pre-boot and wait for the simulator to be ready before testing. A cold,
        # lazily-booted simulator makes the first app launch the slowest and most
        # failure-prone, which is the dominant source of UI-test flakiness here.
        # `bootstatus -b` boots the device if needed and blocks until it is ready.
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project FamilyAssistant.xcodeproj \
            -scheme FamilyAssistant \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        # Unit tests are fast and reliable, so they gate the merge strictly with
        # no retries — a unit failure is a real regression, never masked.
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project FamilyAssistant.xcodeproj \
            -scheme FamilyAssistant \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:FamilyAssistantTests \
            -resultBundlePath TestResults-unit.xcresult
      - name: Run UI tests
        # UI tests drive a full simulator and are subject to launch/render
        # timeouts when the CI runner is slow. Retry failed tests in-process
        # (up to 3 attempts) so transient simulator flakiness self-heals instead
        # of failing the whole job and forcing a manual re-run.
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project FamilyAssistant.xcodeproj \
            -scheme FamilyAssistant \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:FamilyAssistantUITests \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -resultBundlePath TestResults-ui.xcresult
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results-${{ github.run_id }}
          path: |
            ios/FamilyAssistant/TestResults-unit.xcresult
            ios/FamilyAssistant/TestResults-ui.xcresult
          retention-days: 7
          if-no-files-found: ignore
