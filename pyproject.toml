[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "family-assistant"
version = "0.1.0"
authors = [
  { name="Andrew Garrett", email="andrew@andrewjgarrett.com" },
]
description = "A family assistant bot using Telegram, LLMs, and background tasks."
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "a2a-sdk>=0.3.0",
    "python-telegram-bot[ext]>=22.0,<23.0",
    # Use [ext] instead of [job-queue] for v21+
    # Direct provider SDKs
    "openai>=2.44.0,<3.0.0",
    # OpenAI SDK for direct API access
    "google-genai>=2.18.1",
    # Google Gemini SDK for direct API access
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    # Async driver for SQLite (default)
    "asyncpg>=0.29.0",
    # Async driver for PostgreSQL (optional)
    "pgvector>=0.2.0",
    # For vector storage in PostgreSQL (optional)
    "json-schema-for-humans>=0.53.10",
    # For rendering JSON schemas as HTML
    # "apscheduler>=3.10.0", # APScheduler seems unused now? Remove if not needed.
    "PyYAML>=6.0",
    # For loading prompts.yaml
    "starlette>=1.0.1",
    # Pinned to >= 1.0.1 for CVE-2026-48710 (Host header validation bypass)
    "fastapi>=0.111.0",
    # Web framework
    "uvicorn[standard]>=0.29.0",
    # ASGI server
    "jinja2>=3.1.4",
    # HTML templating
    "python-multipart",
    # Required by FastAPI for form data
    "mcp>=1.8.0",
    # Model Context Protocol SDK. Floor is 1.8.0: the Streamable HTTP client
    # transport (mcp.client.streamable_http) was introduced in that release and
    # is imported unconditionally by family_assistant.tools.mcp.
    "caldav>=1.2.0",
    # CalDAV client library
    "vobject>=0.9.6",
    # For parsing VCALENDAR data
    "icalendar>=6.0.0",
    # Robust iCalendar parsing
    "recurring-ical-events>=3.0.0",
    # RRULE expansion for iCal URL feeds
    "httpx>=0.27.0",
    # For fetching iCal URLs asynchronously
    "telegramify-markdown>=0.5.1",
    # For converting Markdown to Telegram MarkdownV2
    "python-dateutil>=2.9.0",
    # For robust datetime parsing (version updated)
    "markdown-it-py>=3.0.0",
    # For rendering Markdown in web server
    "markdownify>=1.1.0",
    # For converting HTML email bodies to Markdown
    "mdit-py-plugins>=0.4.0",
    # Common plugins for markdown-it-py
    "linkify-it-py>=2.0.0",
    # Required by markdown-it-py for linkify feature
    "markitdown[all]>=0.1.1",
    # For converting PDF to Markdown
    "pytz>=2024.1",
    # For timezone handling
    "aiofiles>=23.2.1",
    # For async file operations (LLM recording/playback)
    "passlib[bcrypt]>=1.7.4",
    # For password hashing and API token verification
    "bcrypt>=4.0.0,<5.0.0",
    # Pinned to <5.0.0 due to passlib 1.7.4 incompatibility with bcrypt 5.x
    "Authlib>=1.3.1",
    # For OIDC authentication
    "itsdangerous>=2.1.0",
    # Dependency for signing session cookies (used by Starlette SessionMiddleware)
    "numpy>=1.26.0",
    # Required by pgvector for PostgreSQL vector operations
    "alembic>=1.15.2",
    "filetype>=1.2.0",
    # For detecting file types
    "rebrowser-playwright>=1.52.0",
    # Patched Playwright for reduced bot detection (drop-in replacement)
    "toons>=0.5.4",
    # Token-Oriented Object Notation encoder for LLM-bound snapshots
    "homeassistant-api>=5.0.3",
    # For Home Assistant integration
    "janus>=1.0.0",
    # For thread-safe asyncio-aware queue
    "llm>=0.27.1",
    "backoff>=2.2.1",
    "py-vapid>=1.9.2",
    "pywebpush>=2.1.1",
    "vl-convert-python>=1.6.0",
    # For rendering Vega/Vega-Lite specs to PNG
    "genson>=1.3.0",
    "jq>=1.10.0",
    "soxr>=0.5.0",
    "pycares>=4.4.0,<5.0.0",
    "anyio>=4.9.0",
    # Reolink camera support
    "reolink-aio>=0.16.0",
    # Media download support
    "yt-dlp>=2024.0.0",
    "pydantic-settings>=2.10.1",
    "pydantic-monty>=0.0.17",
    "anthropic>=0.40.0",
    "kubernetes-asyncio>=35.0.0",
    "cloudcoil-models-kubernetes>=1.32",
    "sqlparse>=0.5.5",
    # OpenTelemetry API and zero-code instrumentation runtime
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    "aiomqtt>=2.5.1",
    "dkimpy>=1.1.8",
    "authheaders>=0.16.3",
    "pyspf>=2.0.14",
    "dnspython>=2.8.0",
    "h2>=4.3.0",
    "pyjwt[crypto]>=2.10.1",
    "opentelemetry-distro>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "cryptography>=44.0.1",
    "publicsuffix2>=2.20191221",
    "greenlet>=3.2.3",
]

[project.optional-dependencies]
dev = [
    "telegram-bot-api-mock[dev]", # Mock server for Telegram bot testing
    "fastapi-sso>=0.18.0",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-flakefinder>=1.1.0",
    "pytest-recording>=0.13.0", # VCR.py integration for pytest
    "pytest-xdist>=3.8.0", # Parallel test execution
    "pytest-rerunfailures>=16.4", # Enable @pytest.mark.flaky reruns in CI
    "hypothesis>=6.152.9", # Property-based testing
    "vcrpy>=7.0.0", # HTTP record/replay for testing - v7 fixes urllib3 conflicts
    "aiosqlite",
    "assertpy>=1.1", # Add assertpy
    "ast-grep-cli>=0.39.0", # For code pattern matching and transformations
    "filelock>=3.12", # Serialize the frontend build across pytest-xdist workers
    "pytest-mock",
    "types-aiofiles",
    "types-assertpy", # Added
    # "types-docker", # Temporarily commented out due to urllib3 conflict with vcrpy
    "types-passlib",
    "types-python-dateutil",
    "types-PyYAML",
    "types-pytz",
    "types-vobject",
    "psycopg[binary]>=3.1.0",
    "pylint>=4.0.6",
    "poethepoet>=0.11.0",
    "mcp-proxy>=0.3.0", # Added for testing SSE transport
    "mcp-server-time>=0.1.0", # Ensure mcp-server-time is available for tests
    "radicale>=3",
    "symbex>=2.0",
    "pytest-timeout",
    "pytest-json-report",
    "pytest-alembic>=0.11.0",
    "ruff>=0.16.0",
    "pre-commit>=4.6.1",
    "basedpyright",
    "pytype",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=2.0.0",
    "mdformat-tables>=0.4.1",
    "llm-gemini>=0.27.0",
    "llm-openrouter>=0.4.1",
    "llm-fragments-github>=0.4.0",
    "llm-fragments-reader>=0.1",
    "hupper>=1.12.1",
    "watchdog>=3.0.0",
    "pytest-playwright-asyncio>=0.8.0",
    "playwright==1.52.0", # Pin to match rebrowser-playwright version for shared browser binaries
    "homeassistant>=2025.4.4",
    "pixeltable-pgserver>=0.4.0",
    "monkeytype>=23.3.0", # Runtime type inference from tests
    "browser-handoff-service",
    "jsonschema>=4.24.0",
]
local-embeddings = [
    "sentence-transformers>=3.0.1",
    "torch>=2.4.0",
]
pgserver = [
    "pixeltable-pgserver>=0.4.0",  # PostgreSQL test server (supports Python 3.13+)
]

[project.scripts]
family-assistant = "family_assistant.__main__:main"

[project.urls]
"Homepage" = "https://github.com/werdnum/family-assistant"
"Bug Tracker" = "https://github.com/werdnum/family-assistant/issues"


# --- Setuptools Configuration ---
[tool.setuptools]
# Include files specified in MANIFEST.in or via package_data/include_package_data
# We'll use package_data below. Setting this true is good practice.
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Specify that the 'family_assistant' package should include
# all files within its 'templates' and 'static' subdirectories.
family_assistant = ["templates/**/*", "static/**/*", "data/**/*", "py.typed"]


# --- Task Runner Configuration (poethepoet) ---
[tool.poe.tasks.symbols]
help = "Generate SYMBOLS.md map using symbex"
# Runs symbex on the 'family_assistant' module, includes docstrings,
# suppresses file path comments (-n), includes import statements (-i),
# and saves the output to SYMBOLS.md using shell redirection.
shell = "symbex -m family_assistant --docs -ni > SYMBOLS.md"

[tool.poe.tasks.lint]
help = "Run full linting suite with parallel execution"
shell = "scripts/format-and-lint.sh"

[tool.poe.tasks.lint-fast]
help = "Run only fast linting checks (ruff) - completes in ~1 second"
shell = "scripts/format-and-lint.sh --fast"

[tool.poe.tasks.format]
help = "Format code (ruff format + mdformat)"
shell = """
${VIRTUAL_ENV:-.venv}/bin/ruff format src tests && \
if command -v ${VIRTUAL_ENV:-.venv}/bin/mdformat >/dev/null 2>&1; then \
    find . -name "*.md" \
        -not -path "./.venv/*" \
        -not -path "./venv/*" \
        -not -path "./.git/*" \
        -not -path "./node_modules/*" \
        -not -path "./docs/python-telegram-bot-abridged.md" \
        -not -path "./docs/python-telegram-bot-abridged-filtered.md" \
        2>/dev/null | \
    xargs ${VIRTUAL_ENV:-.venv}/bin/mdformat --wrap 100 2>/dev/null || true; \
fi
"""

[tool.poe.tasks.test]
help = "Run linting and tests with smart parallel execution"
cmd = "scripts/run-tests.sh"

[tool.poe.tasks.test-postgres]
help = "Run tests with PostgreSQL database backend"
cmd = "scripts/run-tests.sh --skip-lint --db postgres -xq"

[tool.poe.tasks.test-postgres-verbose]
help = "Run tests with PostgreSQL database backend (verbose output)"
cmd = "scripts/run-tests.sh --skip-lint --db postgres -xvs"

[tool.poe.tasks.test-sqlite]
help = "Run tests with SQLite database backend only"
cmd = "scripts/run-tests.sh --skip-lint --db sqlite -m 'not postgres' -xq"

[tool.poe.tasks.check-mcp]
help = "Connect to the configured MCP servers and report which ones fail to start"
cmd = "python scripts/check_mcp_servers.py --all"

[tool.poe.tasks.ui-dev]
help = "Run Vite development server for frontend"
shell = "npm run --prefix frontend dev"

[tool.poe.tasks.ui-build]
help = "Build production frontend assets with Vite"
shell = "npm run --prefix frontend build"

[tool.poe.tasks.serve]
help = "Run the full application (Telegram enabled if token is present)"
shell = "DEV_MODE=false GEMINI_API_KEY=${GEMINI_API_KEY:-dev-key} OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-family-assistant} OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none} OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none} OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none} opentelemetry-instrument python -m family_assistant"

[tool.poe.tasks.serve-reload]
help = "Run the full application with auto-reload using hupper"
shell = "DEV_MODE=false GEMINI_API_KEY=${GEMINI_API_KEY:-dev-key} OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-family-assistant} OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none} OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none} OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none} opentelemetry-instrument hupper -m family_assistant -w config.yaml -w prompts.yaml"

[tool.poe.tasks.dev]
help = "Run backend and frontend servers concurrently (access app at http://localhost:5173 or http://<your-ip>:5173)"
sequence = [
    { shell = "echo '🚀 Starting development servers...'" },
    { shell = "echo ''" },
    { shell = "echo '📱 Access the app at:'" },
    { shell = "echo '   - Local: http://localhost:5173'" },
    { shell = "echo '   - Remote: http://<your-ip>:5173'" },
    { shell = "echo ''" },
    { shell = "echo '🔄 Development features:'" },
    { shell = "echo '   - Backend API on port 8000 with auto-reload (hupper)'" },
    { shell = "echo '   - Vite dev server on port 5173 (main entry point)'" },
    { shell = "echo '   - Both servers listening on 0.0.0.0 for remote access'" },
    { shell = "echo '   - Auto-reloads on Python code and config file changes'" },
    { shell = "echo ''" },
    { shell = "echo 'Press Ctrl+C to stop'" },
    { shell = "trap 'echo \"\\n🛑 Stopping servers...\"; exit' INT; (DEV_MODE=true poe serve-reload & poe ui-dev & wait)" }
]

[tool.poe.tasks.frontend-lint]
help = "Lint frontend JavaScript/TypeScript code"
shell = "cd frontend && npm run lint"

[tool.poe.tasks.frontend-lint-fix]
help = "Lint and fix frontend JavaScript/TypeScript code"
shell = "cd frontend && npm run lint:fix"

[tool.poe.tasks.frontend-format]
help = "Format frontend code with Biome"
shell = "cd frontend && npm run format"

[tool.poe.tasks.frontend-check]
help = "Check frontend code formatting and linting without fixing"
shell = "cd frontend && npm run check"

[tool.poe.tasks.format-and-lint]
help = "Format and lint both Python and JavaScript/TypeScript code"
shell = "scripts/format-and-lint.sh"

# --- MonkeyType Type Inference Workflow ---
[tool.poe.tasks.trace]
help = "Run tests through MonkeyType to collect type information"
cmd = "monkeytype run -m pytest"

[tool.poe.tasks.apply-types]
help = "Apply MonkeyType-inferred types to untyped code (safe, won't overwrite existing types)"
shell = "for mod in $(monkeytype list-modules | grep '^family_assistant\\.'); do monkeytype apply $mod; done"

[tool.poe.tasks.apply-types-force]
help = "Apply MonkeyType-inferred types, overwriting existing annotations (use with caution)"
shell = "for mod in $(monkeytype list-modules | grep '^family_assistant\\.'); do monkeytype apply --ignore-existing-annotations $mod; done"

[tool.poe.tasks.review-eval]
help = "Replay the tool-call reviewer over labeled cases and report per-slice scores"
cmd = "python scripts/tool_call_review_eval.py"

[tool.poe.tasks.review-eval-extract-history]
help = "Abstract message history into committable task templates (private dir only)"
cmd = "python scripts/extract_review_history.py"


[tool.ruff.lint.isort]
known-first-party = ["family_assistant"]



[tool.pylint.main]
source-roots = ["src", "."]

[tool.pydantic]
# Enable Pydantic v2 behaviors
validate_default = false
validate_assignment = false
frozen = false
use_enum_values = false
arbitrary_types_allowed = false
from_attributes = true

# Set type validation strictness
strict = false

[tool.ruff]
extend-exclude = ["alembic/**", "docs/**", ".ast-grep/tests/**"]
# Enable preview mode here (not via the --preview CLI flag) so every ruff
# invocation honours it, including the format-on-edit hook plugin which cannot
# pass CLI flags. This keeps the editor hook consistent with CI and pre-commit.
preview = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Type annotations
    "ANN",
    # Commented out code
    "ERA",
    # Async best practices
    "ASYNC",
    # FastAPI
    "FAST",
    # Type Checking
    "TC",
    # pylint convention checks
    "PLC",
    # pylint error checks
    "PLE",
    # pylint refactor checks
    "PLR",
    # pylint warning checks
    "PLW",
    # Stale or misdirected `noqa` directives
    "RUF100",
    "RUF101",
    # Logging: use logger.exception() rather than logger.error(exc_info=True),
    # and pass the exception explicitly when logging outside an except handler
    # (bare `exc_info=True` there depends on an ambient sys.exc_info()).
    "G201",
    "G202",
    "LOG014",
    # Mechanical simplifications, all autofixable
    "FURB105",
    "FURB188",
    "PIE790",
    "PIE807",
    "PYI041",
    "RET501",
    "RUF010",
    "RUF019",
    "RUF022",
]
ignore = [
        # Line length - fornatter can deal with it
        "E501",
        # Allow short loops to avoid invasive refactors
        "PLR1702",
        # Disabled in pylint configuration
        "PLE1132",
        "PLE1141",
        "PLR0904",
        "PLR0911",
        "PLR0912",
        "PLR0913",
        "PLR0914",
        "PLR0915",
        "PLR0916",
        "PLR0917",
        "PLR2004",
        "PLR6301",
        "PLW0108",
        "PLW0602",
        "PLW0603",
        # Allow timeout parameters in function signatures (helpers, protocols)
        "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"contrib/scrape_mcp.py" = ["PLW0717"]
