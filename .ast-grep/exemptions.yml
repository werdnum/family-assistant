# Code Conformance Exemptions
#
# This file tracks exemptions from code conformance rules. Exemptions are granted
# for existing code that violates rules but cannot be fixed immediately.
#
# All exemptions should:
# - Include a clear reason explaining why the exemption is needed
# - Reference a ticket number for tracking future removal (when applicable)
# - Be reviewed periodically to assess if they can be removed
#
# Format:
#   exemptions:
#     - rule: <rule-id>
#       files:
#         - <file-path-or-glob>
#       reason: <explanation>
#       ticket: <ticket-number>  # optional

exemptions:
  # ===========================================================================
  # asyncio.sleep() exemptions - Helper implementation
  # ===========================================================================
  - rule: no-asyncio-sleep-in-tests
    files:
      - tests/helpers.py
    reason: |
      The wait_for_condition() helper itself needs asyncio.sleep() for its polling
      implementation. The rule's spirit (avoid fixed waits in tests) doesn't apply
      to the implementation of the proper alternative.
    ticket: null

  # ===========================================================================
  # asyncio.sleep() exemptions - Mock implementations
  # ===========================================================================
  - rule: no-asyncio-sleep-in-tests
    files:
      - tests/mocks/mock_llm.py
      - tests/integration/llm/streaming_mocks.py
    reason: |
      Mock implementations intentionally simulate realistic delays and streaming
      behavior. The rule targets flaky test waits, not deliberate timing simulation.
    ticket: null

  # ===========================================================================
  # asyncio.sleep() exemptions - Legacy test code (to be refactored)
  # ===========================================================================
  - rule: no-asyncio-sleep-in-tests
    files:
      - tests/conftest.py
      - tests/functional/indexing/*.py
      - tests/functional/test_*.py
      - tests/functional/web/test_*.py
      - tests/functional/web/conftest.py
      - tests/unit/web/test_message_notifier.py
    reason: |
      Legacy tests that predate wait_for_condition() helper.
      Should be refactored to use condition-based waiting.
    ticket: "#TBD-refactor-sleep-to-wait-for-condition"

  # ===========================================================================
  # time.sleep() exemptions - Legacy test code (to be refactored)
  # ===========================================================================
  - rule: no-time-sleep-in-tests
    files:
      - tests/conftest.py
    reason: |
      Legacy test fixtures in conftest.py use time.sleep() for synchronous
      blocking waits. Should be refactored to use async alternatives.
    ticket: "#TBD-refactor-sleep-to-wait-for-condition"

  # ===========================================================================
  # ast-grep rule fixtures - Deliberate positive examples
  # ===========================================================================
  - rule: no-strict-assistant-message-wait
    files:
      - .ast-grep/tests/conformance/no-strict-assistant-message-wait-positive.py
    reason: |
      Positive rule fixture intentionally contains banned Playwright locator waits
      so .ast-grep/test-rules.py can verify the rule catches them.
    ticket: null

  # ===========================================================================
  # NoteWritePolicy.UNCONSTRAINED exemptions - Approved admin surfaces
  # ===========================================================================
  - rule: no-unconstrained-note-write-policy
    files:
      - src/family_assistant/storage/repositories/notes.py
      - src/family_assistant/web/routers/notes_api.py
      - src/family_assistant/web/routers/asterisk_live_api.py
      - test_*.py
    reason: |
      NoteWritePolicy.UNCONSTRAINED is the deliberate opt-out for trusted admin surfaces.
      notes.py defines the sentinel; the web notes API and the call-transcript writer bypass
      visibility confinement by design; test files (test_*.py, matched at any depth) exercise
      both confined and unconstrained writes. All other note writers must derive the policy
      from the active profile.
    ticket: null

  # ===========================================================================
  # NoteReadPolicy.UNRESTRICTED exemptions - Reads made on nobody's behalf
  # ===========================================================================
  - rule: no-unrestricted-note-read-policy
    files:
      - src/family_assistant/storage/repositories/notes.py
      - src/family_assistant/web/routers/notes_api.py
      - src/family_assistant/web/routers/vector_search_api.py
      - src/family_assistant/indexing/notes_indexer.py
      - src/family_assistant/tools/confirmation.py
      - .ast-grep/tests/conformance/no-unrestricted-note-read-policy-positive.py
      - test_*.py
    reason: |
      Each of these reads on nobody's behalf, so there is no profile whose read
      confinement could apply.

      notes.py defines the sentinel, and its write paths look a title up to find
      out whether the row exists at all; the visibility-sensitive half of that
      check goes through NoteWritePolicy.see_before_overwrite_read_policy().
      notes_api.py is the admin management UI, which already bypasses write
      confinement for the same reason, and vector_search_api.py is the same UI's
      document search. notes_indexer.py indexes a note by id for every future
      reader; per-reader filtering happens at search time, in the vector store,
      which is where a profile's read policy is applied to indexed content.
      confirmation.py's existence lookup mirrors the repository's
      unconditional one so the approver is shown the same preflight the write
      will run.

      The positive fixture exists to violate the rule; test files (test_*.py, at
      any depth) exercise both confined and unconfined reads.
    ticket: null

  # ===========================================================================
  # Raw visibility-grant reads - assembling a context, not performing a read
  # ===========================================================================
  - rule: no-raw-visibility-grants-read
    files:
      - .ast-grep/tests/conformance/no-raw-visibility-grants-read-positive.py
      - test_*.py
    reason: |
      The positive fixture exists to violate the rule. Test files (test_*.py, at any
      depth) build execution contexts and assert on the grants they were given, which
      is assembling a context rather than reading on a profile's behalf.
    ticket: null

  # ===========================================================================
  # dict[str, Any] exemptions - Hook scripts with arbitrary JSON
  # ===========================================================================
  - rule: no-dict-any
    files:
      - .claude/review-hook.py
    reason: |
      Hook script receives arbitrary JSON input from Claude Code PreToolUse hook system.
      The hook data structure is defined externally and is genuinely arbitrary - different
      tools have different structures. Creating typed structures for this would be overly
      rigid and doesn't provide value since the hook only extracts specific fields.
    ticket: null

  # ===========================================================================
  # Raw create_async_engine() exemptions - the factory itself and its fixture
  # ===========================================================================
  - rule: no-raw-create-async-engine
    files:
      - src/family_assistant/storage/base.py
      - .ast-grep/tests/conformance/no-raw-create-async-engine-positive.py
    reason: |
      storage/base.py defines create_engine_with_sqlite_optimizations, the one place
      allowed to call SQLAlchemy's constructor. The positive rule fixture intentionally
      contains raw calls so .ast-grep/test-rules.py can verify the rule catches them.
    ticket: null


  # ===========================================================================
  # Raw transaction management - the storage layer implements the primitives
  # ===========================================================================
  - rule: no-raw-transaction-management
    files:
      - src/family_assistant/storage/database.py
      - src/family_assistant/storage/__init__.py
      - .ast-grep/tests/conformance/no-raw-transaction-management-positive.py
    reason: |
      database.py is where Database/DatabaseTransaction are implemented, so it is the
      one place allowed to call engine.begin(). storage/__init__.py runs schema
      creation before any application code exists to hold a transaction.
    ticket: null

  # ===========================================================================
  # Definition-record chokepoint exemptions - rule test fixtures
  # ===========================================================================
  - rule: no-unstamped-executable-definition-write
    files:
      - .ast-grep/tests/conformance/no-unstamped-executable-definition-write-positive.py
    reason: |
      The positive fixture exists to violate the rule. It is what proves the rule
      still fires; exempting it keeps the conformance run clean without weakening
      the rule.
    ticket: null

  - rule: no-dict-any
    files:
      - .ast-grep/tests/conformance/no-unstamped-executable-definition-write-positive.py
      - .ast-grep/tests/conformance/no-unstamped-executable-definition-write-negative.py
    reason: |
      The fixtures stand in for SQLAlchemy values() mappings, whose contents are
      genuinely heterogeneous column values. Naming a real typed structure here
      would obscure the shape the rule is matching on.
    ticket: null

  - rule: no-raw-note-table-write
    files:
      - src/family_assistant/storage/repositories/notes.py
      - .ast-grep/tests/conformance/no-raw-note-table-write-positive.py
      - test_*.py
    reason: |
      The notes repository is the provenance chokepoint and the one module that writes the
      table. The positive fixture exists to violate the rule. Tests build legacy row shapes
      (a row with no provenance envelope, as written before stamping existed) that no
      repository method may produce.
    ticket: null

  - rule: no-unspecced-mock
    files:
      - .ast-grep/tests/conformance/no-unspecced-mock-positive.py
    reason: |
      The positive fixture exists to violate the rule, which is what proves the rule
      still fires.
    ticket: null

