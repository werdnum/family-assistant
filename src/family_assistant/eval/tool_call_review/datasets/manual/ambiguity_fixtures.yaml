          sources:
            - source_type: user_message
              source_id: known-2
              tier: known_contact
              labels: []
              reason: Forwarded message from a known contact.
          approved_sinks: []
    arguments:
      name: weekly_photo_backup
      parameters:
        week: '2026-08-24'
    taint_state:
      version: runtime_v2
      max_tier: known_contact
      history_high_taint_present: false
      fresh_high_taint_seen_at_sequence: null
      sources:
        - source_type: user_message
          source_id: known-2
          tier: known_contact
          labels: []
          reason: Forwarded message from a known contact.
      approved_sinks: []
    policy_contexts:
      - kind: taint_cell
        identifier: known_contact.sandbox_network
        description: User-authored backup script that uploads to the cloud; genuine ambiguity.
