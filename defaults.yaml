  - id: "coder"
    description: "Coding agent. Writes and runs code, works with files, and reads the web to get a self-contained programming or computation task DONE — write and test a script, transform or analyse data, debug a snippet, work out a result — returning the finished output rather than instructions. Runs on the Google Antigravity managed agent (Gemini 3.8 Flash) in a throwaway Google-hosted Linux sandbox, so it sees nothing but the text of the request: no notes, calendar, documents, Home Assistant or other Family Assistant tools, and no shared workspace. Attachments you pass are mounted as files in its sandbox under /workspace, so hand it the file rather than pasting the contents. Choose it over spawn_worker when the task needs no files from the shared workspace and you want the result back in the conversation; choose spawn_worker when the agent must read or write shared workspace files, and complex_tasks when the task needs the family's own data."
    processing_config:
      provider: "google"
      llm_model: "antigravity-preview-05-2026"
      antigravity_config:
        model: "gemini-3.8-flash"
      # A whole turn here runs code in a sandbox with network access, which is
      # the same privilege spawn_worker holds -- so it is gated the same way,
      # by the runtime taint matrix rather than by trusting the caller. The
      # shipped matrix denies this at unknown_external and confirms it below
      # that, so content the assistant derived from an email cannot direct the
      # agent, whether it arrives as request text or as a routed attachment.
      taint_sink_class: "sandbox_network"
      # An autonomous sandbox run can plan and execute for a long stretch, so
      # give a delegated run the same headroom as the research max tier before
      # it is reaped as orphaned.
      max_async_seconds: 7200
      prompts:
        system_prompt: "You are a coding agent working for {user_name}. You run in an isolated sandbox with code execution, a scratch filesystem and web access; you have no access to {user_name}'s notes, calendar, documents or devices, so work only from what is in the request. Write the code, run it, and check the output before you answer — carry the task through to a finished result rather than describing how it could be done. The sandbox is discarded when you finish, so include any code, data or files that matter in your reply. Report what you did along with the result; your final text response will be sent directly to {user_name}."
    # ...and that gate follows the deployment's rollout stage rather than
    # overriding it. Under the shipped `observe` mode the declaration decides
    # nothing yet, which is deliberate: a profile-level `enforce` here would
    # apply the context-free tier x sink matrix to this one profile while the
    # deployment is still measuring its false-positive rate, and that matrix is
    # what the rollout is stalled on (see
    # docs/design/runtime-taint-enforcement-operational-findings.md). It would
    # also refuse more than untrusted input: the matrix confirms rather than
    # denies at known_contact and recognized_machine, but the calling profile's
    # tool gate is still in observe, so it never asks and no approval is ever
    # recorded -- an override turns those tiers into refusals with nothing that
    # could satisfy them. The correction that document proposes for this very
    # cell moves interactive unknown_external the other way, from denial to
    # confirmation. The declaration takes effect deployment-wide, in one step,
    # when the mode is switched.
    #
    # A deployment that injects credentials into the sandbox via
    # antigravity_config.environment is adding [B] to a profile that reads the
    # open web, and is making that widening itself; it should set
    # taint_policy.mode to match, since under observe nothing here gates.
    tools_policy:
      default_decision: "deny"
    # This profile's own deny cannot refuse the three tools global_tools_policy
    # grants everywhere: global rules land in the `profile` policy layer, which
    # outranks the `defaults` layer this policy occupies. Without the exclusion
    # the profile is advertised over /api/profiles as holding tools its own
    # description says it does not have. The agent could not call them anyway
    # -- no tool declarations are sent to the Interactions API -- but the
    # advertised surface has to match the claim, and it stops the grant
    # becoming live if tools are ever plumbed through.
    excluded_global_tools:
      - "read_text_attachment"
      - "jq_query"
      - "report_technical_problem"
    slash_commands:
      - "/coder"
  - id: "data_visualization"
    description: "Assistant profile optimized for creating data visualizations and charts. Uses Vega/Vega-Lite to generate professional charts from user data."
    processing_config:
      include_aggregated_context: true
