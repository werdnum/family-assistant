  - id: "engineer"
    description: "Engineering diagnostic profile with read-only access to source code, database, and error logs. Use for investigating application issues, debugging problems, and filing bug reports. Cannot modify data or execute code."
    processing_config:
      provider: "anthropic"
      llm_model: "claude-sonnet-4-6"
      max_iterations: 100
      prompts:
        system_prompt: |
          You are an engineering diagnostic assistant helping {user_name} investigate and debug the Family Assistant application.

          Current time: {current_time}

          {aggregated_other_context}

          ## Your Capabilities

          You have read-only access to:
          - **Source code**: Read files and search the codebase
          - **Database**: Execute SELECT queries to examine application state
          - **Error logs**: Read application error and warning logs
          - **LLM history**: Inspect recent LLM requests/responses
          - **Notes and documents**: Read stored notes and documents
          - **Automations**: View automation configurations and statistics
          - **Events**: Query recent system events
          - **Configuration**: Inspect the live AppConfig and individual service profile configs (with secrets redacted)
          - **MCP servers**: View live MCP server connection status and the tools each server provides
          - **System info**: Python version, OS platform, database dialect

          ## Your Limitations

          - You CANNOT modify any data (no INSERT, UPDATE, DELETE)
          - You CANNOT execute code or scripts
          - You CANNOT send messages to users
          - You CANNOT delegate to other profiles
          - You CAN create GitHub issues to report bugs (requires confirmation)
          - You CAN reconnect a failed MCP server (requires confirmation)

          ## Investigation Approach

          1. Start by understanding the reported problem
          2. Check error logs for recent errors or warnings
          3. Examine relevant source code to understand the implementation
          4. Query the database to check application state
          5. For MCP/tool issues: use get_mcp_server_status to confirm each MCP server is connected and exposes the expected tool names
          6. For config issues: use get_resolved_config and get_profile_config to inspect the live runtime config
          7. Summarize findings and recommend fixes
          8. If appropriate, create a GitHub issue with your findings
    tools_policy:
      default_decision: "deny"
      rules:
        - match:
            names:
              - "read_source_file"
              - "search_source_code"
              - "query_database"
              - "read_error_logs"
              - "get_llm_request_history"
              - "create_github_issue"
              - "get_mcp_server_status"
              - "reconnect_mcp_server"
              - "get_resolved_config"
              - "get_profile_config"
              - "get_system_info"
              - "get_message_history"
              - "list_notes"
              - "get_note"
              - "search_documents"
              - "get_full_document_content"
              - "get_user_documentation_content"
              - "list_pending_callbacks"
              - "query_recent_events"
              - "list_automations"
              - "get_automation"
              - "get_automation_stats"
          decision: "allow"
          priority: 10
        - match:
            names:
              - "create_github_issue"
              - "reconnect_mcp_server"
          decision: "confirm"
          priority: 20
    slash_commands:
      - "/engineer"
# Other global settings like llm_parameters, indexing_pipeline_config remain at top level.
# Attachment handling configuration
attachment_config:
  # Maximum file size for general attachments (in bytes)
  # Default: 100MB to handle large documents/images
  max_file_size: 104857600 # 100 * 1024 * 1024
  # Maximum file size for multimodal LLM processing (in bytes)
  # This is typically lower due to LLM provider limits
  # Default: 20MB (most LLM providers support up to 20MB images)
  max_multimodal_size: 20971520 # 20 * 1024 * 1024
  # Storage path for chat attachments
  # Can be overridden by chat_attachment_storage_path for backward compatibility
  storage_path: "/tmp/chat_attachments"
  # Allowed MIME types for attachments
  allowed_mime_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"
    - "image/bmp"
    - "image/tiff"
    - "application/pdf"
    - "text/plain"
    - "application/json"
    - "text/csv"
    - "video/mp4"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
# AI Worker Sandbox configuration
# Enables spawning isolated AI coding agents for complex computing tasks
ai_worker_config:
  enabled: false
  backend_type: "kubernetes" # "kubernetes", "docker", "mock"
  workspace_mount_path: "/workspace"
  default_timeout_minutes: 30
  max_timeout_minutes: 120
  max_concurrent_workers: 3
  task_retention_hours: 48
  resources:
    memory_request: "512Mi"
    memory_limit: "2Gi"
    cpu_request: "500m"
    cpu_limit: "2000m"
  kubernetes:
    namespace: "ml-bot"
    ai_coder_image: "ghcr.io/werdnum/ai-coding-base:latest"
    service_account: "ai-worker"
    runtime_class: "gvisor"
    job_ttl_seconds: 3600
    enable_rootless_podman: false
  docker:
    image: "ghcr.io/werdnum/ai-coding-base:latest"
    network: "bridge"
# Optional integration with an external browser-server (handoff service).
# When enabled, the semantic DOM browser tools run against a remote browser
# session that can be transferred to a human via noVNC. Disabled by default;
# when off, browsing uses the in-process local Playwright backend.
browser_handoff_config:
  enabled: false
  service_url: null
  timeout_seconds: 30.0
  auth:
    type: "bearer"
    token_env: "BROWSER_HANDOFF_SERVICE_TOKEN"
  handoff_capable_profiles:
    - "browser_profile"
    - "browser_visual_profile"
otel:
  enabled: false
  service_name: "family-assistant"
  traces_exporter: "otlp-grpc"
  metrics_exporter: "otlp-grpc"
  otlp_endpoint: "http://localhost:4317"
  log_correlation: true
  traces_sample_rate: 1.0
  debug_console_exporter: false
# Secrets (telegram_token, api_keys, database_url) are primarily from env.
# Model, embedding_model, server_url, storage_paths are also top-level or env.

