# Suppression budgets, enforced by scripts/check_suppression_budget.py.
#
# Each number is how many violations of that ruff rule exist but go
# unreported, whether silenced by per-file-ignores or by a suppression
# comment. The check fails if a count rises above its budget, and lowers
# the budget automatically when a count falls. Do not raise a number here
# to make a lint failure go away — fix the code the rule is pointing at.

[budgets]
"PLW0717" = 0
