      unique identifier of the event to modify (obtained from search_calendar_events)."},"calendar_url":{"type":"string","description":"The
      calendar URL where the event is stored (obtained from search_calendar_events)."},"calendar_id":{"type":"string","description":"Optional
      ID of the calendar where the event is stored (from list_calendars or the Source
