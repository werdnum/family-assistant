      maximum number of results. Default is 20, maximum is 100.","default":20},"include_context":{"type":"integer","description":"Optional
      number of neighboring messages per side to include for each result. Default
      is 0, maximum is 10.","default":0},"content_offset":{"type":"integer","description":"Optional
      character offset to start each row''s content at, for reading further into a
      long row. Default is 0.","default":0},"max_content_chars":{"type":"integer","description":"Optional
      maximum characters of content and of each tool call''s arguments per row. Default
      is 4000 for a lookup by turn_id, tool_call_ids or message_ids and 300 for a
      search or listing; maximum is 20000."}},"required":[]},"type":"function"},{"description":"Sends
      a textual message to another known user. Use this tool ONLY when explicitly
      requested to message a specific person (e.g., ''Tell Alice...''). Do NOT use
      this tool for reminders or notifications unless specifically asked to notify
      another person. For normal reminders, simply write the text in your response
      and it will be delivered to the current user automatically. You MUST use the
      recipient''s Chat ID as the target, which is listed in the ''Known users'' section
      of your household context. Optionally, you can include attachments with the
      message.\n\nThe target must be an existing conversation that an authorized user
      has already used to talk to the assistant; invented or guessed IDs are rejected.\n\nReturns:
      A string indicating the result. On success, returns ''Message sent successfully
      to user with Chat ID [chat_id].''. If message is sent but history recording
      fails, returns ''Message sent to user with Chat ID [chat_id], but failed to
      record in history.''. On error, returns ''Error: Could not send message to Chat
      ID [chat_id]. Details: [error details]'', ''Error: Chat interface not available.'',
      ''Error: Chat ID [chat_id] is not a known conversation with an authorized user
      of this assistant.'', or ''Error: Cannot use send_message_to_user tool to send
      a message to the user you are already replying to. The user will receive your
      final response directly in this conversation.''.","name":"send_message_to_user","parameters":{"type":"object","properties":{"target_chat_id":{"type":"string","description":"The
      conversation ID of the recipient. For Telegram conversations, this is the numeric
      Chat ID. For web conversations, this is a UUID. The ID must be from a known
      conversation provided in the system context, and must belong to an authorized
      user who has already talked to the assistant."},"message_content":{"type":"string","description":"The
      content of the message to send to the user."},"attachment_ids":{"type":"array","items":{"type":"string"},"description":"Optional
      list of attachment UUIDs to send along with the message. These must be accessible
      in the current conversation."}},"required":["target_chat_id","message_content"]},"type":"function"},{"description":"Retrieve
      metadata information about a specific attachment by its UUID. This includes
      details like file size, MIME type, description, source, and creation time.\n\nReturns:
      A JSON string containing attachment metadata including attachment_id, mime_type,
      description, size, source_type, source_id, conversation_id, created_at, and
      any additional metadata. On error, returns ''Error: [error details]''.","name":"get_attachment_info","parameters":{"type":"object","properties":{"attachment_id":{"type":"string","description":"The
      UUID of the attachment to retrieve information about."}},"required":["attachment_id"]},"type":"function"},{"description":"Post
      a note into another of the current user''s own conversations, such as their
      Home or one of their threads. The assistant there is woken to act on it, and
      its reply appears in that conversation. Use it when the user asks you to pass
      something to another conversation, or when a result here belongs in a conversation
      that is waiting for it. It cannot reach other people''s conversations; use send_message_to_user
      to message someone else. Pass ''home'' for the user''s Home, or a conversation_id
      you were given (list_threads lists Home''s threads).","name":"post_to_conversation","parameters":{"type":"object","properties":{"target_conversation_id":{"type":"string","description":"''home''
      for the user''s Home, or the id of another conversation this user owns."},"message_content":{"type":"string","description":"The
      note: what the assistant there should know or do."},"attachment_ids":{"type":"array","items":{"type":"string"},"description":"Optional
      attachment UUIDs of this user''s to pass along."}},"required":["target_conversation_id","message_content"]},"type":"function"},{"description":"Execute
      inline Python (`script`, optional `globals`) or a stored script (`name`, optional
      `parameters`). Load `scripting.md` with `get_user_documentation_content` before
      writing or debugging scripts. Review and confirmation bind source, inputs and
      statically named child scripts. Changed child definitions require fresh review.
      Deterministic operations share program approval, even after llm(), unless the
      review watches their tool. Hard policy applies; delegations, judgment-based
      tools and new definitions are gated separately. Enabled tools and script APIs
      are available as functions.","name":"execute_script","parameters":{"type":"object","properties":{"script":{"type":"string","description":"Inline
      Python source. Load `scripting.md` with `get_user_documentation_content` before
      writing or debugging scripts. Omit this when using `name`."},"globals":{"type":"object","description":"Optional
      global values for inline `script` code. Do not use with a stored script.","additionalProperties":true},"name":{"type":"string","description":"Stored
      script name. Use `list_scripts` to discover names; omit `script` and pass arguments
      with `parameters`."},"script_bindings":{"type":"array","items":{"type":"object"},"description":"Resolved
      child definitions bound to an approval. Omit when preparing a new invocation;
      the runtime supplies these."},"parameters":{"type":"object","description":"Optional
      arguments for the stored script selected by `name`; validated against its parameter
      schema.","additionalProperties":true}}},"type":"function"},{"description":"Save
      a reusable script to the script library. Scripts are stored by name and can
      be executed later via execute_script(name=''...''). Use this to save scripts
      that are useful for repeated tasks like data processing, report generation,
      or automation routines.\n\nScripts are validated before saving. If validation
      fails, an error is returned.\nScripts saved here can also be referenced by automations
      using script_name in action_config. Users can create or edit stored scripts
      in the web UI at /scripts. To approve tainted notes, scripts, or automations
      without editing them, direct the user to /artifacts, where Review and confirm
      shows the complete content before recording human approval. Referenced scripts
      and note attachments require separate review.","name":"save_script","parameters":{"type":"object","properties":{"name":{"type":"string","description":"Unique
      name for the script (e.g. ''daily-cleanup'', ''generate-report'')"},"description":{"type":"string","description":"Human-readable
      description of what the script does"},"code":{"type":"string","description":"The
      Python script code. Same sandbox rules as execute_script: no classes, no yield,
      no with statements. All enabled tools are available as functions."},"parameters_schema":{"type":"object","description":"Optional
      JSON Schema describing the parameters the script expects. Parameters are passed
      as global variables when the script runs.\nExample: {\"type\": \"object\", \"properties\":
      {\"days_old\": {\"type\": \"integer\"}}, \"required\": [\"days_old\"]}","additionalProperties":true}},"required":["name","description","code"]},"type":"function"},{"description":"List
      all stored scripts with their names, descriptions, and parameter schemas.","name":"list_scripts","parameters":{"type":"object","properties":{}},"type":"function"},{"description":"Get
      full details of a stored script including its code.","name":"get_script","parameters":{"type":"object","properties":{"name":{"type":"string","description":"Name
      of the script to retrieve"}},"required":["name"]},"type":"function"},{"description":"Delete
      a stored script from the library.","name":"delete_script","parameters":{"type":"object","properties":{"name":{"type":"string","description":"Name
      of the script to delete"}},"required":["name"]},"type":"function"},{"description":"Run
      a Monty script against the real Family Assistant tool registry while simulating
      selected tool outputs with the default LLM. Use this to test whether a script
      will survive contact with reality before running it against real action tools.\n\nSimulation
      rules:\n- Real registered tools are exposed to the script.\n- Read-only tools
      run for real by default.\n- State-changing, destructive, external-communication,
      and code-execution tools are simulated by default.\n- Simulated tools use the
      scenario description, the real tool schema, prior calls in this run, and historical
      examples from the same conversation or user when available.\n- Action tools
      are logged and simulated; they do not execute.\n- Direct brokered HTTP APIs
      are unavailable in the simulation harness.\n- No attachments are synthesized
      in v1.","name":"test_script_with_simulated_tools","parameters":{"type":"object","properties":{"script":{"type":"string","description":"The
      Monty script to execute."},"scenario_description":{"type":"string","description":"Plain-language
      description of the test scenario and how simulated tools should behave."},"simulated_tools":{"type":"array","items":{"type":"string"},"description":"Optional
      tool names to force into simulation mode even if they are read-only."},"passthrough_tools":{"type":"array","items":{"type":"string"},"description":"Optional
      read-only tool names to explicitly allow to run for real. Action tools cannot
      be forced into passthrough."},"globals":{"type":"object","description":"Optional
      globals to inject into the script.","additionalProperties":true}},"required":["script","scenario_description"],"additionalProperties":false},"type":"function"},{"description":"Attach
      files/images to your current response being sent to the user. The attachments
      will be sent along with your text response. This is the ONLY way to attach files
      to your reply \u2014 never type attachment metadata (e.g. `<attachment_metadata>...`
      blocks or individual `id:` entries) into your reply text; the user will see
      it as raw text. Only use attachment IDs that are accessible in the current conversation.","name":"attach_to_response","parameters":{"type":"object","properties":{"attachment_ids":{"type":"array","items":{"type":"string","description":"UUID
      of an attachment"},"description":"List of attachment IDs to include with this
      response"}},"required":["attachment_ids"]},"type":"function"},{"description":"Read
      text content from an attachment with optional filtering and pagination. Use
      this to explore large text files or tool results that were auto-converted to
      attachments. Lines longer than 2000 characters are split into pieces, so grep,
      offset and limit work on a file that is one long line, and a read is capped
      at max_chars. For JSON, jq_query extracts exactly the fields you need. Stored
      attachment provenance is tracked internally; using external-source content may
      make later writes, browsing, worker execution, or outgoing messages require
      approval.","name":"read_text_attachment","parameters":{"type":"object","properties":{"attachment_id":{"type":"string","description":"The
      UUID of the text attachment to read."},"grep":{"type":"string","description":"Optional
      substring to filter lines (case-insensitive)."},"offset":{"type":"integer","description":"Number
      of lines to skip from the beginning (default 0).","default":0},"limit":{"type":"integer","description":"Maximum
      number of lines to return (default 100).","default":100},"max_chars":{"type":"integer","description":"Maximum
      characters to return (default 8000, maximum 50000). A longer read stops early
      and says which offset to continue from.","default":8000}},"required":["attachment_id"]},"type":"function"},{"description":"Draw
      colored rectangles or circles to highlight regions on an image. Useful for marking
      objects, areas of interest, or annotations. Creates and displays a new image
      with the highlighted regions.\n\nBounding box coordinates are in normalized
      [0, 1000] format (Gemini object detection format). Format is [y_min, x_min,
      y_max, x_max] where coordinates are normalized to 0-1000.\n\nExample region
      format:\n{\n  \"box\": [200, 100, 400, 300],\n  \"label\": \"chicken\",\n  \"color\":
      \"red\"\n}\n\nNote: thickness is automatically scaled to 1% of image size if
      not specified.","name":"highlight_image","parameters":{"type":"object","properties":{"image_attachment_id":{"type":"string","description":"The
      UUID of the image attachment to highlight regions on. Must be an existing image
      attachment from the current conversation."},"regions":{"type":"array","description":"List
      of regions to highlight on the image. Each region is a bounding box with optional
      styling.","items":{"type":"object","properties":{"box":{"type":"array","description":"Bounding
      box in Gemini format: [y_min, x_min, y_max, x_max] normalized to [0, 1000]","items":{"type":"number"},"minItems":4,"maxItems":4},"label":{"type":"string","description":"Optional
      description of what is being highlighted (e.g., ''chicken'', ''car'', ''person'')"},"color":{"type":"string","enum":["red","green","blue","yellow","orange","purple","cyan","magenta"],"description":"Color
      of the highlight","default":"red"},"shape":{"type":"string","enum":["rectangle","circle"],"description":"Shape
      of the highlight (note: circle uses bounding box center and treats width as
      diameter)","default":"rectangle"},"thickness":{"type":"number","description":"Thickness
      of the outline in pixels","default":3}},"required":["box"]},"minItems":1}},"required":["image_attachment_id","regions"]},"type":"function"},{"description":"Generate
      and display a new image from text description using AI","name":"generate_image","parameters":{"type":"object","properties":{"prompt":{"type":"string","description":"Detailed
      description of the image to generate"},"style":{"type":"string","enum":["auto","photorealistic","artistic"],"default":"auto","description":"Style
      of the generated image"}},"required":["prompt"]},"type":"function"},{"description":"Edit,
      transform, or combine one or more existing reference images based on text instructions.
      Use this for object removal/addition, style changes, variations, or merging
      elements from multiple images.","name":"transform_image","parameters":{"type":"object","properties":{"image":{"type":"string","description":"UUID
      of the attachment. Single image to transform. Prefer `images` when using multiple
      references."},"images":{"type":"array","items":{"type":"string","description":"UUID
      of an attachment"},"description":"One or more reference images to edit, transform,
      or combine. When combining images, put the primary image first.","minItems":1},"instruction":{"type":"string","description":"Natural
      language instruction for how to transform the image"}},"required":["instruction"]},"type":"function"},{"description":"Create
      a data visualization from a Vega or Vega-Lite specification and return it as
      a PNG image. The LLM provides the spec and optional data (either as direct data
      structures or attachments).","name":"create_vega_chart","parameters":{"type":"object","properties":{"spec":{"type":"string","description":"Vega
      or Vega-Lite specification as a JSON string. Use Vega-Lite for simpler charts
      (recommended). The spec should include the data inline or use named datasets
      that will be populated from data or data_attachments."},"data_attachments":{"type":"array","items":{"type":"string","description":"UUID
      of an attachment"},"description":"Optional list of attachment IDs containing
      CSV or JSON data files to use in the visualization. Each attachment should be
      referenced by name in the spec''s data field. Use this for file-based data.","default":[]},"data":{"type":"object","description":"Optional
      data as a direct object. If a dict with string keys, treated as named datasets
      (e.g., {''temps'': [...], ''humidity'': [...]}). If a list or other structure,
      automatically assigned to a default dataset named ''data'' - your Vega spec
      MUST reference it using {\"name\": \"data\"}. Use this for computed data from
      other tools like jq_query."},"title":{"type":"string","description":"Optional
      title for the chart that will be shown to the user","default":"Data Visualization"},"scale":{"type":"number","description":"Scale
      factor for the output PNG (default 2 for high DPI displays)","default":2},"debug":{"type":"boolean","description":"If
      true, return the generated spec as JSON instead of rendering to PNG. Useful
      for debugging and inspecting the spec with data merged in.","default":false}},"required":["spec"]},"type":"function"},{"description":"Query
      JSON data from an attachment using jq syntax. Use this to explore and extract
      specific fields from large JSON datasets without loading the entire content
      into context. Returns the query result as formatted JSON. Queries are stopped
      after 30 seconds, and results over 8 MB are rejected, so narrow the query rather
      than returning whole large datasets.","name":"jq_query","parameters":{"type":"object","properties":{"attachment_id":{"type":"string","description":"The
      UUID of the attachment containing JSON data to query."},"jq_program":{"type":"string","description":"The
      jq program/query to run on the JSON data. Examples: ''length'' (count items),
      ''.[0]'' (first item), ''map(.field)'' (extract field from all items), ''[.[0].date,
      .[-1].date]'' (get date range)."}},"required":["attachment_id","jq_program"]},"type":"function"},{"description":"Generates
      a video from a text prompt (and optional reference images) using Google''s video
      models. The operation is asynchronous and may take some time (usually a few
      minutes). Returns the generated video as an attachment.","name":"generate_video","parameters":{"type":"object","properties":{"prompt":{"type":"string","description":"The
      text description for the video. Supports audio cues, camera motion, style, etc."},"images":{"type":"array","items":{"type":"string","description":"UUID
      of an attachment"},"description":"Optional list of up to 3 reference images
      (style/content guide).","maxItems":3},"first_frame_image":{"type":"string","description":"UUID
      of the attachment. The initial image to animate (for Image-to-Video or Interpolation)."},"last_frame_image":{"type":"string","description":"UUID
      of the attachment. The final image for interpolation. Must be used with `first_frame_image`.
      (Veo only.)"},"negative_prompt":{"type":"string","description":"Text describing
      what not to include in the video. (Veo only.)"},"aspect_ratio":{"type":"string","enum":["16:9","9:16"],"default":"16:9","description":"The
      video''s aspect ratio. Default is 16:9."},"duration_seconds":{"type":"string","enum":["4","6","8"],"default":"8","description":"Length
      of the generated video in seconds. Default is 8."},"model":{"type":"string","description":"Optional
      model override. Defaults to Gemini Omni Flash (gemini-omni-1.1-flash) for fast
      conversational video. A `veo-*` id, or use of `negative_prompt` or `last_frame_image`
      without a model override, selects Veo for cinematic, higher-quality clips instead."}},"required":["prompt"]},"type":"function"},{"description":"Downloads
      video or audio from a URL using yt-dlp. Supports YouTube and 1000+ other sites.
      Returns the downloaded file as an attachment. Use metadata_only=true to get
