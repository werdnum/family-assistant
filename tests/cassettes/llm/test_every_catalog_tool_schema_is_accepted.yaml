      information on their phone. Choose open_url for an HTTPS link whose notification
      should open the link directly; otherwise choose open_conversation. The recipient
      and conversation come from the authenticated voice session.","name":"send_to_my_chat","parameters":{"type":"object","properties":{"title":{"type":"string","description":"Short
      notification title."},"content":{"type":"string","description":"Text to keep
      in Chat."},"action_kind":{"type":"string","enum":["open_url","open_conversation"]},"action_url":{"type":"string","description":"HTTPS
      URL for open_url; omit for open_conversation."}},"required":["title","content","action_kind"]},"type":"function"},{"description":"Structured
      and semantic lookup against past conversation history. Use structured mode for
      exact filters like dates, roles, tools, attachments, or errors; semantic mode
      for fuzzy recall; and hybrid mode when both are useful. When you already know
      a turn_id, tool_call_ids or message_ids (an earlier turn''s compacted note names
      them), pass them to read exactly those rows, oldest first, instead of searching.
      Returns compact message summaries (each with a stable message_id, turn_id, timestamp,
      role, content, and optional neighboring context), or an empty list when nothing
      matches. A search or listing returns a snippet of each row (the first 300 characters
      of content and of each tool call''s arguments); read the rows you need in full
      by passing their message_ids, which return up to 4000 characters each. Each
      content and tool-call arguments string is cut to max_content_chars starting
      at content_offset; a cut one reports content_length or arguments_length, and
      one without them is complete, so read further with a larger content_offset.
      A result too large to keep inline was saved as an attachment, which read_text_attachment
      can page through or grep. Semantic recall lags the conversation by a couple
      of minutes because a turn is indexed once it has finished, so use structured
      mode to look up something said in the last few exchanges.","name":"get_message_history","parameters":{"type":"object","properties":{"query":{"type":"string","description":"Optional
      natural language or keyword text to search for."},"search_mode":{"type":"string","enum":["structured","semantic","hybrid"],"description":"Use
      structured for exact filters, semantic for fuzzy recall, or hybrid for both.","default":"structured"},"conversation_id":{"type":"string","description":"Optional
      conversation filter. Narrows results to one conversation."},"turn_id":{"type":"string","description":"Optional
      exact lookup: every row of this turn."},"tool_call_ids":{"type":"array","items":{"type":"string"},"description":"Optional
      exact lookup: the calls with these ids and their results."},"message_ids":{"type":"array","items":{"type":"integer"},"description":"Optional
      exact lookup: the rows with these message_ids."},"after_message_id":{"type":"integer","description":"Optional:
      continue an exact lookup after this message_id. A lookup that filled its limit
      returns next_after_message_id to pass here."},"scope":{"type":"string","enum":["same_user","current_conversation","all_accessible"],"description":"Search
      scope. Defaults to same_user when user identity is available. all_accessible
      is denied unless policy enables it.","default":"same_user"},"roles":{"type":"array","items":{"type":"string","enum":["user","assistant","tool","system","error"]},"description":"Optional
      role filters."},"tool_names":{"type":"array","items":{"type":"string"},"description":"Optional
      tool names to find in tool responses or assistant tool calls."},"start_time":{"type":"string","description":"Optional
      inclusive ISO datetime lower bound."},"end_time":{"type":"string","description":"Optional
      inclusive ISO datetime upper bound."},"has_attachments":{"type":"boolean","description":"Optional
      filter for messages with or without attachments."},"has_error":{"type":"boolean","description":"Optional
      filter for error messages or tool/message rows with tracebacks."},"processing_profile_id":{"type":"string","description":"Optional
      processing profile filter. Omit to use the current profile. Use ''*'' only when
