      it fires: a new thread of the user''s Home when they use threads, so each run
      gets its own card there, otherwise a new conversation. It only works in the
      web app, and the new thread or conversation has no history, so the context must
      say everything the woken turn needs.\n\nFor script:\n  - script_code: Python
      code to execute (inline), OR\n  - script_name: name of a stored script from
