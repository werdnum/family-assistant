      Such an automation''s event_filter names the subscription with ''server_id'',
      ''event'' and one ''arguments.<name>'' key per argument; any other key filters
      the delivered events, e.g. ''data.category''. Only events offered for polling
      can be used.","name":"list_mcp_events","parameters":{"type":"object","properties":{"server_id":{"type":"string","description":"Only
      this MCP server. Omit to list every server."}},"required":[]},"type":"function"},{"description":"Create
      a new automation (event-triggered or schedule-based).\n\nEvent automations trigger
      when specific events occur (e.g., email received, calendar event).\nSchedule
      automations run on a recurring schedule using RRULE format.\n\nIMPORTANT: Times
      in RRULE strings (BYHOUR, BYMINUTE, etc.) are interpreted in the user''s\nconfigured
      timezone, NOT UTC. For example, if the user is in Australia/Sydney and asks
      for\n\"every day at 9am\", use BYHOUR=9 \u2014 the system will schedule it at
      9am Sydney time.\n\nExamples:\n- Event: \"Send me a reminder when I receive
      an email from work\"\n- Schedule: \"Wake me up every weekday at 7am\" (RRULE:
      FREQ=DAILY;BYDAY=MO,TU,WE,TH,FR;BYHOUR=7;BYMINUTE=0)","name":"create_automation","parameters":{"type":"object","properties":{"name":{"type":"string","description":"Unique
      name for the automation"},"automation_type":{"type":"string","enum":["event","schedule"],"description":"Type
      of automation: ''event'' for event-triggered, ''schedule'' for time-based"},"trigger_config":{"type":"object","description":"Configuration
      for the trigger.\nFor event automations:\n  - event_source: string (e.g., ''email_received'',
      ''calendar_event'')\n  - event_filter: object with filtering criteria\n  - condition_script:
      optional Python expression evaluated before action runs. Must return truthy
      to proceed.\n\nFor schedule automations:\n  - recurrence_rule: RRULE string
      (e.g., ''FREQ=DAILY;BYHOUR=7;BYMINUTE=0''). Times are in the user''s configured
      timezone."},"action_type":{"type":"string","enum":["wake_llm","script"],"description":"Action
      to perform: ''wake_llm'' to notify you, ''script'' to run code"},"action_config":{"type":"object","description":"Configuration
      for the action.\nFor wake_llm:\n  - context: string with optional context for
      the LLM\n  - conversation: where each firing wakes you. Omit it for the default:
      the user''s Home in the web and iOS apps when they have one, otherwise this
