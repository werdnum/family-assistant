interactions:
- request:
    body: '{"model":"gemini-3.8-flash","input":[{"content":[{"text":"Say hello. Do
      not call any tool.","type":"text"}],"type":"user_input"}],"store":false,"stream":false,"tools":[{"description":"Add
      a new note or update an existing note with the given title. Use this for the
      user''s own notes: lists, reference material, documents, anything they asked
      you to write down as a note \u2014 including when someone asks you to remember
      something and you have no memory tool. If `propose_memory_edits` is among your
      tools, prefer it for the household''s long-term memory \u2014 standing preferences,
      facts about people, decisions, routines, and anything you are asked to forget
      \u2014 because it edits memory entry by entry and keeps each entry''s evidence.
      Notes can have attachments (images, documents) associated with them by providing
      attachment UUIDs. Leave `include_in_prompt` at its default `false` unless the
      note is short, evergreen context that must load every turn (see the parameter
      description). To create a reusable skill instead of a plain note, load the ''Skill
      Creation'' skill via `get_note` for the frontmatter format. A note that would
      be loaded every turn (include_in_prompt=true, or a skill) is reviewed before
      it is saved when this conversation has read outside content; the result says
      whether it was admitted, saved as a reference note only, or not saved.\n\nReturns
      a string indicating success or an error message.","name":"add_or_update_note","parameters":{"type":"object","properties":{"title":{"type":"string","description":"The
      unique title of the note."},"content":{"type":"string","description":"The content
      of the note."},"include_in_prompt":{"type":"boolean","description":"Whether
      to auto-load the full note into your context on every turn. Default is false
      \u2014 the note is still stored and searchable, and `list_notes` finds it so
      you can load it on demand via `get_note`. Set to true ONLY for short evergreen
      context (durable user preferences, household policies, persistent identity facts)
      that you want present every turn.","default":false},"append":{"type":"boolean","description":"Whether
      to append the content to an existing note instead of replacing it. Default is
      false. When true, the content will be added to the end of the existing note
      with a newline separator.","default":false},"attachment_ids":{"type":"array","items":{"type":"string"},"description":"Optional
      list of attachment UUIDs to associate with this note. These attachments will
      be returned when retrieving the note."},"visibility_labels":{"type":"array","items":{"type":"string"},"description":"Optional
      list of visibility labels for access control. Notes are only visible to profiles
      with matching grants. If not specified, new notes get default labels from config.
      The active profile''s policy may add required labels or reject label values
      you request. An empty list [] only makes the note visible to all profiles when
      the active profile permits unrestricted note writes."}},"required":["title","content"]},"type":"function"},{"description":"Retrieve
      a specific note by its title to check its content, prompt inclusion status,
      and attachments. Returns the note''s title, content, whether it''s auto-loaded
      into your context every turn, and any associated attachments.\n\nReturns: A
      JSON string containing a dict with the note information. If note exists, returns
      {''exists'': true, ''title'': [title], ''content'': [full content], ''include_in_prompt'':
      [boolean], ''attachment_count'': [integer], ''provenance_labels'': [labels]}.
      If note not found, returns {''exists'': false, ''title'': [title], ''content'':
      null, ''include_in_prompt'': null, ''attachment_count'': 0}. Attachments are
      returned as multimodal content that vision models can see. When present, provenance_labels
      describe stored source provenance, not access-control visibility labels.","name":"get_note","parameters":{"type":"object","properties":{"title":{"type":"string","description":"The
      title of the note to retrieve."}},"required":["title"]},"type":"function"},{"description":"List
      all notes with their titles, prompt inclusion status, and attachment counts.
      Can optionally filter to show only notes that are auto-loaded into your context
      every turn, or only those that are not.\n\nReturns: A JSON string containing
      a list of note summaries. Returns an array where each item is {''title'': [title],
      ''include_in_prompt'': [boolean], ''content_preview'': [first 100 chars], ''attachment_count'':
      [integer]}. If no notes exist or match the filter, returns an empty array ''[]''.","name":"list_notes","parameters":{"type":"object","properties":{"include_in_prompt":{"type":"boolean","description":"Optional
      filter. If true, shows only notes included in prompt. If false, shows only excluded
      notes. If not specified, shows all notes."}},"required":[]},"type":"function"},{"description":"Delete
      a note by its title. This permanently removes the note from the system. Use
      with caution as this action cannot be undone.\n\nReturns: A JSON string containing
      a dict with the operation result. On success, returns {''success'': true, ''message'':
      ''Note [title] deleted successfully.''}. If note not found, returns {''success'':
      false, ''message'': ''Note [title] not found.''}.","name":"delete_note","parameters":{"type":"object","properties":{"title":{"type":"string","description":"The
      title of the note to delete."}},"required":["title"]},"type":"function"},{"description":"Change
      the household''s long-term memory, one entry at a time. Memory is a small set
      of notes carrying the ''memory'' label: one always-loaded core note of standing
      facts, plus topic notes per person, project or recurring theme. Use this tool
      when someone asks you to remember or forget something durable \u2014 a standing
      preference, a fact about a person or the household, a decision and its reason,
      a routine.\n\nThis is NOT the tool for ordinary notes. `add_or_update_note`
      writes the user''s own notes and documents; `propose_memory_edits` writes memory
      entries.\n\nSend the whole change as one call: the list is validated and applied
      together or not at all. Each edit is one of:\n- add: append a new entry to a
      note (creates the note as a memory topic note if it does not exist yet)\n- replace:
      swap one existing entry for new text\n- remove: delete one existing entry\n-
      move: relocate an entry verbatim to another memory note, which is how you make
      room in a full core note\n\nMemory is household-wide and can surface in anyone''s
      conversation, so leave out what was plainly meant for one person. When you remove
      an entry because someone asked you to forget it, tell them it is gone from memory
      but not from conversation history or search, and can come back if somebody says
      it again.\n\nRules the apply path enforces, so plan for them:\n- Every entry
      rests on a message, and the evidence is recorded for you. Leave `message_ids`
      out unless you were shown message ids to cite: when you are acting on what somebody
      just asked you, the message they asked in is cited automatically. Never invent
      an id. A move cites nothing either way: the entry keeps the references it already
      carries.\n- `target_text` must match exactly one existing entry in the named
      note, after leading ''- '' and surrounding whitespace are ignored. If it matches
      none or several, the whole list is refused and the reply quotes the note''s
      current entries \u2014 quote one of them back exactly.\n- Notes have size caps.
      If a write would overflow the core note, move the least standing entries to
      a topic note in the same call.\n- Write the date, who said it, and what kind
      of claim it is (a statement, a correction, an inference) into the entry text
      yourself. Message references are appended for you.\n\nReturns a string saying
      whether the list was applied, and if not, exactly why each edit was refused.
      If this turn has read outside content, a contributing conversation may defer
      the request to its later review. That review can keep what the person said in
      their own messages, not outside results or assistant replies; ask them to state
      any needed detail in their own words and do not claim it was saved. A profile
      that does not read the household''s memory cannot write it either, and every
      call is refused with that reason.","name":"propose_memory_edits","parameters":{"type":"object","properties":{"edits":{"type":"array","description":"The
      edits to apply together, in order.","items":{"type":"object","properties":{"op":{"type":"string","enum":["add","replace","remove","move"],"description":"What
      to do to the note''s entries."},"note_title":{"type":"string","description":"The
      memory note this edit applies to. A title that does not exist yet is created
      as a memory topic note."},"entry":{"type":"string","description":"The entry''s
      new text, for ''add'' and ''replace''. One entry, written as a sentence; include
      the date, the speaker, and whether it is a statement, a correction or an inference."},"target_text":{"type":"string","description":"The
      current text of the entry being changed, for ''replace'', ''remove'' and ''move''.
      Must match exactly one entry of the note."},"destination_note_title":{"type":"string","description":"For
      ''move'' only: the memory note the entry is moved to."},"message_ids":{"type":"array","items":{"type":"integer"},"description":"The
      ids of the messages this edit rests on, for ''add'', ''replace'' and ''remove''.
      Supply them only when you were shown message ids; omit this field otherwise
      and the message being acted on is cited for you. Must be empty for ''move''."}},"required":["op","note_title"]}}},"required":["edits"]},"type":"function"},{"description":"Delegates
      a specific user request to another specialized assistant profile (service) that
      might have different tools or capabilities. Use this if the main assistant cannot
      handle a request directly or if a specialized profile is more appropriate for
      the task. The available service profiles and their descriptions are listed in
      your system prompt. Profile-to-profile delegation controls are enforced by the
      tool policy engine.\n\nReturns the delegated service''s text response, or \u2014
      when the work runs long \u2014 an async reference ID. When you get a reference
      outside voice mode, the result wakes this profile and your follow-up is delivered
      to the conversation. In voice mode, the result is posted directly to the saved
      Chat conversation without waking this profile. End your turn instead of polling
      get_delegation_status in a loop. Errors are returned as text (and, for failed
      async runs, a reference ID you can pass to get_delegation_status for the full
      detail).\n\nEach delegation starts a fresh, isolated conversation with the target
      profile. To instead continue a previous finished delegation \u2014 so the target
      profile keeps the context of that earlier exchange \u2014 pass its reference
      ID as resume_delegation_id (with the same target_service_id). Use list_delegations
      to find the reference.","name":"delegate_to_service","parameters":{"type":"object","properties":{"target_service_id":{"type":"string","description":"The
      unique ID of the target service profile to delegate the request to (e.g., ''browser_profile'')."},"user_request":{"type":"string","description":"The
      specific request, question, or prompt to be processed by the target service."},"confirm_delegation":{"type":"boolean","description":"Optional.
      If true, explicitly ask the user for confirmation before delegating the task.
      Defaults to false. Policy-level confirmation requirements may also apply.","default":false},"attachment_ids":{"type":"array","items":{"type":"string"},"description":"Optional
      list of attachment UUIDs to include with the delegated request. These attachments
      must be accessible in the current conversation and are passed to the target
      service for processing -- including a service running on a remote agent, which
      receives the file itself rather than a reference. Files the service produces
      come back attached to its result, so you can pass them on or work with them
      by id."},"handoff_after_seconds":{"type":"number","description":"Optional. Override
      how long to wait for an inline result before returning an async reference. Clamped
      by service configuration."},"delivery_hint":{"type":"string","enum":["auto","background"],"description":"Optional.
      Use ''background'' to return an async reference immediately; otherwise ''auto''
      waits briefly for a fast inline result.","default":"auto"},"resume_delegation_id":{"type":"string","description":"Optional.
      Reference ID of a previous finished delegation (from delegate_to_service or
      list_delegations) to continue instead of starting a fresh conversation. The
      target profile resumes that delegation''s history and retains its context. Must
      reference a completed or failed delegation to the same target_service_id in
      this conversation."},"model_tier":{"type":"string","description":"Optional.
      Run the target on a specific model tier or a specific model, as listed with
      the target profile in your system prompt. Only values listed there are accepted;
      omit to use the target''s default. A specific model has no fallback: if it is
      unavailable the delegation fails rather than quietly answering with another
      model, so several delegations to the same profile at different specific models
      (for example, to compare independent answers) each come from the model named.
      A tier changes how carefully the target answers, never its tools, access or
      confirmations. Name a specific model only when the user asks for one, or for
      a side-by-side of models'' answers (delegate the same request once per model,
      in parallel, and say which answer came from which)."}},"required":["target_service_id","user_request"]},"type":"function"},{"description":"Returns
      the status and available result for an asynchronous profile delegation reference.
      Use this for references returned by delegate_to_service, not for spawn_worker
      task IDs. Set peek to true to also look at a run that is still going: for a
      coding agent, its latest steps (commands run, their output, its thinking) and
      the files in its sandbox. Peek when the user asks what the delegate is doing
      or a long run needs checking on; it only looks and cannot steer or stop the
      run.","name":"get_delegation_status","parameters":{"type":"object","properties":{"delegation_id":{"type":"string","description":"The
      delegation reference ID returned by delegate_to_service, e.g. delegation_abc123."},"peek":{"type":"boolean","description":"Also
      report what a run still in progress has done so far. Takes a few seconds.","default":false}},"required":["delegation_id"]},"type":"function"},{"description":"Lists
      recent asynchronous profile delegations for the current conversation, with a
      short preview of each request and of each completed result. Call get_delegation_status
      for a completed run''s full result. This is distinct from list_worker_tasks,
      which lists spawn_worker jobs.","name":"list_delegations","parameters":{"type":"object","properties":{"status":{"type":"string","description":"Optional
      status filter such as queued, running, completed, or failed."},"limit":{"type":"integer","description":"Optional
      maximum number of delegation runs to return. Defaults to 10.","default":10}},"required":[]},"type":"function"},{"description":"Stops
      an asynchronous profile delegation that is no longer wanted -- a duplicate,
      or one the user has called off -- so its result is never delivered. Works on
      a delegation that is queued, running a turn here, or running on a remote agent
      (such as coder or research). A running turn stops at once. A remote agent is
      asked to stop but may still run to the end; its result is ignored either way.
      Anything already done stays done. A delegation waiting on delegations of its
      own cannot be cancelled until they finish. Use list_delegations to find the
      reference. This is distinct from cancel_worker_task, which stops spawn_worker
      jobs.","name":"cancel_delegation","parameters":{"type":"object","properties":{"delegation_id":{"type":"string","description":"The
      delegation reference ID to cancel, e.g. delegation_abc123."}},"required":["delegation_id"]},"type":"function"},{"description":"Moves
      a piece of work out of the user''s Home conversation into a thread of its own,
      run by the profile best suited to it. Use it for work that outlives this turn:
      anything that runs in the background (browsing, research, delegated jobs), waits
      on someone, takes several steps the user will want to follow, or is a project
      they will come back to. Answer quick questions, small edits and reminders here
      in Home instead.\n\nThe thread starts with your request and nothing else from
      this conversation, so write a request that stands on its own. It returns at
      once: tell the user you have started a thread and end your turn. The thread''s
      progress and answers appear in the thread, not here, so do not wait for it or
      report back on it.","name":"start_thread","parameters":{"type":"object","properties":{"target_service_id":{"type":"string","description":"The
      profile that runs the thread, from those listed in your system prompt (e.g.
      ''browser_profile'', ''complex_tasks'')."},"title":{"type":"string","description":"A
      short title for the thread, a few words naming the job (e.g. ''Hot water system
      quotes'')."},"request":{"type":"string","description":"The complete, self-contained
      request the thread starts from."},"attachment_ids":{"type":"array","items":{"type":"string"},"description":"Optional
      attachment UUIDs from this conversation to pass to the thread with the request."},"model_tier":{"type":"string","description":"Optional.
      Run the thread on a specific model tier, as listed with the target profile in
      your system prompt. Omit to use the profile''s default."}},"required":["target_service_id","title","request"]},"type":"function"},{"description":"Closes
      this thread''s job. You are working in a thread: a conversation spun off the
      user''s Home for one piece of work. Call this once the job is complete (outcome
      ''done''), or once it turns out it cannot be done (outcome ''failed'').\n\nAfter
      calling it, end your turn with a final message that states the outcome on its
      own -- what was found, decided or done, or why it could not be. That message
      is copied into the user''s Home as the thread''s result, so write it to be read
      there without the rest of the thread.\n\nDo not call it when your reply asks
      the user something or waits on them: a thread that ends on a question is waiting
      on the user, not done. Do not call it for progress updates. If something new
      arrives in the thread later, it reopens, and you can finish it again.","name":"finish_thread","parameters":{"type":"object","properties":{"outcome":{"type":"string","enum":["done","failed"],"description":"''done''
      when the job is complete; ''failed'' when it cannot be done."}},"required":["outcome"]},"type":"function"},{"description":"Lists
      the threads of the user''s Home, most recently active first: each one''s title,
      the profile that runs it, and its state -- working, waiting on the user, done
      or failed -- plus, for a thread its assistant finished, the outcome it reported.
      Use it to answer questions about work that was moved into threads (''how are
      the quotes going?''). It does not show what was said in a thread; if the user
      wants the detail, point them to the thread.","name":"list_threads","parameters":{"type":"object","properties":{}},"type":"function"},{"description":"Reads
      the latest messages in the user''s Home, oldest first. You are working in a
      thread, which starts without seeing Home, where reminders, briefs and automation
      results arrive. Use this when the user refers to something you can''t see, such
      as ''snooze that'' or ''about that reminder''. Don''t use it otherwise: most
      of what is in Home has nothing to do with this thread.","name":"read_home_messages","parameters":{"type":"object","properties":{}},"type":"function"},{"description":"Schedule
      a reminder to be sent at a specific time. Use this tool when users ask to be
      reminded of something. Supports automatic follow-up reminders if the user doesn''t
      respond.\n\nReturns: A string indicating the result. On success, returns ''OK.
      Reminder scheduled for [time].'' or ''OK. Reminder scheduled for [time] (with
      follow-ups every [interval], up to [N] times).'' if follow-up enabled. On parameter
      error, returns ''Error: Invalid reminder parameters. [details]''. On other errors,
      returns ''Error: Failed to schedule the reminder.''.","name":"schedule_reminder","parameters":{"type":"object","properties":{"reminder_time":{"type":"string","format":"date-time","description":"The
      exact date and time (ISO 8601 format, including timezone, e.g., ''2025-05-10T14:30:00+02:00'')
      when the reminder should be sent."},"message":{"type":"string","description":"The
      reminder message to send (e.g., ''Take your medication'', ''Call mom'', ''Submit
      the report'')."},"follow_up":{"type":"boolean","description":"If true, will
      automatically send follow-up reminders if the user doesn''t respond. Use for
      important reminders or when user says ''don''t let me forget''.","default":false},"follow_up_interval":{"type":"string","description":"Time
      between follow-up reminders (e.g., ''30 minutes'', ''1 hour''). Only used if
      follow_up is true.","default":"30 minutes"},"max_follow_ups":{"type":"integer","description":"Maximum
      number of follow-up reminders to send. Only used if follow_up is true.","default":2},"conversation":{"type":"string","enum":["home","source"],"description":"Where
      the reminder is delivered. Omit it for the default: the user''s Home in the
      web and iOS apps when they have one, otherwise this conversation (always this
      chat in Telegram). ''source'' delivers it here, in this conversation, which
      suits one that only makes sense next to this conversation''s history. ''home''
      asks for Home explicitly."}},"required":["reminder_time","message"]},"type":"function"},{"description":"Schedule
      a future trigger for yourself (the assistant) to continue processing or check
      on a task at a specified time. Use this for continuing work or checking task
      status, NOT for reminders. For reminders, use schedule_reminder instead.\n\nReturns:
      A string indicating the result. On success, returns ''OK. Callback scheduled
      for [time].''. On invalid time format or past time, returns ''Error: Invalid
      callback time provided. Ensure it''s a future ISO 8601 datetime with timezone.
      [details]''. On other errors, returns ''Error: Failed to schedule the callback.''.","name":"schedule_future_callback","parameters":{"type":"object","properties":{"callback_time":{"type":"string","format":"date-time","description":"The
      exact date and time (ISO 8601 format, including timezone, e.g., ''2025-05-10T14:30:00+02:00'')
      when the callback should be triggered."},"context":{"type":"string","description":"The
      specific instructions or information you need to remember for the callback (e.g.,
      ''Check if the download finished'', ''Continue analyzing the data'')."},"conversation":{"type":"string","enum":["home","source"],"description":"Where
      the callback is delivered. Omit it for the default: the user''s Home in the
      web and iOS apps when they have one, otherwise this conversation (always this
      chat in Telegram). ''source'' delivers it here, in this conversation, which
      suits one that only makes sense next to this conversation''s history. ''home''
      asks for Home explicitly."}},"required":["callback_time","context"]},"type":"function"},{"description":"Lists
      all pending LLM callback tasks for the current conversation (in the user''s
      Home, also their reminders and callbacks set up elsewhere that will arrive in
      Home), including:\n- One-time callbacks from schedule_future_callback\n- Reminder
      callbacks from schedule_reminder\nReturns task IDs, scheduled times, and context
      for each pending callback.\n\nReturns: A formatted string listing pending callbacks.
      If callbacks exist, returns ''Pending LLM callbacks:'' followed by entries with
      ''- Task ID: [id]\n  Scheduled At: [time]\n  Context: [context preview]''. If
      no callbacks found, returns ''No pending LLM callbacks found for this conversation.''.
      On error, returns ''Error: Failed to list pending callbacks. [details]''.","name":"list_pending_callbacks","parameters":{"type":"object","properties":{"limit":{"type":"integer","description":"Optional.
      Maximum number of pending callbacks to list (default: 5).","default":5}},"required":[]},"type":"function"},{"description":"Modifies
      the scheduled time or context of a specific pending LLM callback task. You must
      provide the task_id of the callback to modify.\n\nReturns: A string indicating
      the result. On success, returns ''Callback task [task_id] modified successfully.''.
      If neither new_callback_time nor new_context provided, returns ''Error: You
      must provide either a new_callback_time or a new_context to modify.''. If task
      not found, returns ''Error: Callback task with ID [task_id] not found.''. If
      task not an LLM callback, returns ''Error: Task [task_id] is not an LLM callback
      task.''. If task not pending, returns ''Error: Callback task [task_id] is not
      pending (current status: [status]). It cannot be modified.''. If task belongs
      to different conversation, returns ''Error: Callback task [task_id] does not
      belong to this conversation. Modification denied.''. On invalid new time, returns
      ''Error: Invalid new_callback_time. [details]''. On other errors, returns ''Error:
      Failed to modify callback task. [details]''.","name":"modify_pending_callback","parameters":{"type":"object","properties":{"task_id":{"type":"string","description":"The
      unique ID of the LLM callback task to modify (obtained from list_pending_callbacks
      or when it was scheduled)."},"new_callback_time":{"type":"string","format":"date-time","description":"Optional.
      The new exact date and time (ISO 8601 format, including timezone, e.g., ''2025-06-01T10:00:00-07:00'')
      for the callback. If omitted, the time is not changed."},"new_context":{"type":"string","description":"Optional.
      The new context or instructions for the callback. If omitted, the context is
      not changed."}},"required":["task_id"]},"type":"function"},{"description":"Cancels
      a specific pending LLM callback task by its task_id. Use this to:\n- Cancel
      one-time future callbacks\n- Cancel scheduled reminders\nNote: This cancels
      only the specific task instance identified by task_id.\n\nReturns: A string
      indicating the result. On success, returns ''Callback task [task_id] cancelled
      successfully.''. If task not found, returns ''Error: Callback task with ID [task_id]
      not found.''. If task not an LLM callback, returns ''Error: Task [task_id] is
      not an LLM callback task.''. If task not pending, returns ''Error: Callback
      task [task_id] is not pending (current status: [status]). It cannot be cancelled.''.
      If task belongs to different conversation, returns ''Error: Callback task [task_id]
      does not belong to this conversation. Cancellation denied.''. On other errors,
      returns ''Error: Failed to cancel callback task. [details]''.","name":"cancel_pending_callback","parameters":{"type":"object","properties":{"task_id":{"type":"string","description":"The
      unique ID of the LLM callback task to cancel (obtained from list_pending_callbacks
      or when it was scheduled)."}},"required":["task_id"]},"type":"function"},{"description":"Schedule
      any action (wake_llm or script) to execute at a specific time. This is the general-purpose
      scheduling tool that complements schedule_future_callback. Use this when you
      need to schedule script execution or want more control over LLM callbacks.\n\nReturns:
      A string indicating the result. On success, returns ''OK. [action_type] action
      scheduled for [schedule_time]''. If invalid action_type, returns ''Error: Invalid
      action_type. Must be one of: [valid types]''. If wake_llm missing context, returns
      ''Error: wake_llm action requires ''context'' in action_config''. If script
      missing script_code, returns ''Error: script action requires ''script_code''
      in action_config''. If schedule_time in past, returns ''Error: Schedule time
      must be in the future''. On invalid time format, returns ''Error: Invalid schedule_time
      format: [details]''. On other errors, returns ''Error: Failed to schedule action.
      [details]''.","name":"schedule_action","parameters":{"type":"object","properties":{"schedule_time":{"type":"string","format":"date-time","description":"When
      to execute the action (ISO 8601 format with timezone, e.g., ''2025-05-10T14:30:00+02:00'')"},"action_type":{"type":"string","enum":["wake_llm","script"],"description":"Type
      of action to execute","default":"wake_llm"},"action_config":{"type":"object","description":"Configuration
      for the action. For wake_llm: {''context'': ''message for LLM''}. For script:
      {''script_code'': ''Python code'', ''timeout'': 600}. Either may add ''conversation''
      to say where the woken assistant replies: omit it for the default (the user''s
      Home in the web and iOS apps when they have one, otherwise this conversation),
      ''source'' for this conversation, or ''home''."}},"required":["schedule_time","action_config"]},"type":"function"},{"description":"Search
      previously stored documents (emails, notes, files) using semantic and keyword
      matching. Returns titles and snippets of the most relevant documents.\n\nReturns:
      A formatted string containing search results. On success, returns ''Found relevant
      documents:'' followed by numbered results with Title, Source, Document ID, optional
      original file availability (\ud83d\udcce), Metadata, and Snippet. When original
      files (PDFs, images) are available, they are indicated with \ud83d\udcce symbol
      and file info. Use get_full_document_content to retrieve the actual file. If
      no results found, returns ''No relevant documents found matching the query and
      filters.''. On error, returns ''Error: Failed to execute document search. [error
      details]'' or ''Error: Query text cannot be empty.'' or ''Error: Failed to generate
      embedding for the query.''. Returned document provenance is tracked internally;
      using external-source results may make later writes, browsing, worker execution,
      or outgoing messages require approval.","name":"search_documents","parameters":{"type":"object","properties":{"query":{"type":"string","description":"The
      natural language query describing the information to search for."},"source_types":{"type":"array","items":{"type":"string"},"description":"Optional.
      Filter results to only include documents from specific sources. Common sources:
      ''email'', ''note'', ''google_drive'', ''pdf'', ''image''. Use ONLY if you are
      certain about the source type, otherwise omit this filter."},"embedding_types":{"type":"array","items":{"type":"string"},"description":"Optional.
      Filter results based on the type of content that was embedded. Common types:
      ''content_chunk'', ''summary'', ''title'', ''ocr_text''. Use ONLY if necessary
      (e.g., searching only titles), otherwise omit this filter."},"limit":{"type":"integer","description":"Optional.
      Maximum number of results to return (default: 5).","default":5}},"required":["query"]},"type":"function"},{"description":"Retrieves
      the full content of a document in the best available format using its unique
      document ID (obtained from a previous search). Returns original file (PDF, image,
      etc.) when available, otherwise text content.\n\nReturns: ToolResult with file
      attachment when original file is available, otherwise a string containing the
      text content. When original file exists, returns both the file as an attachment
      and extracted text for context. For PDFs and images, you can analyze the file
      directly using your multimodal capabilities. If only text content is available,
      returns the full text content (raw content if available, or reconstructed from
      chunks). For email documents, the result also includes an `attachments` list
      with `attachment_id` values for each email attachment; pass those IDs to `read_text_attachment`
      or `get_attachment_info` to inspect attachment contents. The document''s stored
      source provenance is tracked internally; using external-source content may make
      later writes, browsing, worker execution, or outgoing messages require approval.
      For legacy emails ingested before registry integration, the first call may return
      `attachment_id: null` for some entries \u2014 the returned text will describe
      the action needed (e.g. triggering a reindex) without prescribing a specific
      tool, since the write tool is only enabled in some profiles. If document exists
      but no content available, returns ''Error: Document [id] found, but no content
      is available.''. If document not found, returns ''Error: Document with ID [id]
      not found.''. On error, returns ''Error: Failed to retrieve content for document
      ID [id]. [error details]''. Files larger than 20MB will fallback to text-only
      for performance.","name":"get_full_document_content","parameters":{"type":"object","properties":{"document_id":{"type":"integer","description":"The
      unique identifier of the document whose full content is needed."}},"required":["document_id"]},"type":"function"},{"description":"Submits
      a document from a given URL for ingestion and indexing by the system. Use this
      tool if the user asks you to ''save'' a web page. The document will be fetched
      from the URL, its content extracted, processed, and stored to be made searchable.
      Provide a unique source_id for tracking this ingestion request.\n\nReturns:
      A string indicating the ingestion status. On success, returns ''URL submitted.
      Service response: [message]. Document ID: [id]. Task Enqueued: [status].''.
      If ingestion fails, returns ''Error submitting URL for ingestion: [message].
      Details: [error details]''. If configuration missing, returns ''Error: Server
      configuration missing (document storage path).''. On unexpected error, returns
      ''Error: An unexpected error occurred while submitting the URL. [error details]''.","name":"ingest_document_from_url","parameters":{"type":"object","properties":{"url_to_ingest":{"type":"string","format":"uri","description":"The
      fully qualified URL of the document to ingest."},"title":{"type":"string","description":"Optional.
      The primary title to assign to this document. If omitted, the title will be
      extracted automatically during the indexing process from the web page content."},"source_type":{"type":"string","description":"A
      category or type for this document source, e.g., ''llm_url_ingestion'', ''user_link_submission''."},"source_id":{"type":"string","description":"A
      unique identifier for this specific document within its source_type. This should
