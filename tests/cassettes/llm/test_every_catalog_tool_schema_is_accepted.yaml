      X (0-999)"},"end_y":{"type":"integer","description":"End Y (0-999)"},"intent":{"type":"string","description":"Model-stated
      intent for this action"}},"required":["start_x","start_y","end_x","end_y"]},"type":"function"},{"description":"Navigate
      to a URL.","name":"navigate","parameters":{"type":"object","properties":{"url":{"type":"string","description":"URL
      to navigate to"},"intent":{"type":"string","description":"Model-stated intent
      for this action"}},"required":["url"]},"type":"function"},{"description":"Navigate
