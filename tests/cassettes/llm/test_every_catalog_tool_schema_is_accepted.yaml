      or ''home''."},"description":{"type":"string","description":"Optional description
      of what this automation does"}},"required":["name","automation_type","trigger_config","action_type","action_config"]},"type":"function"},{"description":"List
      all automations, optionally filtered by type (event/schedule) or enabled status","name":"list_automations","parameters":{"type":"object","properties":{"automation_type":{"type":"string","enum":["event","schedule"],"description":"Filter
      by automation type (omit to show all)"},"enabled_only":{"type":"boolean","description":"Only
      show enabled automations (default: false)","default":false}}},"type":"function"},{"description":"Get
      details of a specific automation by ID","name":"get_automation","parameters":{"type":"object","properties":{"automation_id":{"type":"integer","description":"ID
      of the automation"},"automation_type":{"type":"string","enum":["event","schedule"],"description":"Type
