      cannot be empty'', ''message'': ''Please provide at least one condition to test''}.
      When no events match and validation is available, analysis will include validation
      errors and suggestions. On other errors, returns {''error'': ''Failed to test
      event listener: [error details]'', ''match_conditions'': [conditions used]}.","name":"test_event_listener","parameters":{"type":"object","properties":{"source":{"type":"string","description":"Event
      source to test against (e.g., ''home_assistant'', ''indexing'')"},"match_conditions":{"type":"object","description":"Match
      conditions to test. Use dot notation for nested fields (e.g., {''entity_id'':
      ''person.alex'', ''new_state.state'': ''Home''})"},"hours":{"type":"integer","description":"Number
      of hours to look back (default: 24, max: 48)","default":24},"limit":{"type":"integer","description":"Maximum
      number of matching events to return (default: 10, max: 20)","default":10}},"required":["source","match_conditions"]},"type":"function"},{"description":"List
      the event types connected MCP servers (for example the Tuit task tracker) offer
      to automations, as seen with the current user''s credential: each event''s name,
      description, the arguments a subscription takes (JSON Schema) and the payload
