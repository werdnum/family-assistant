      calendar URL where the event is stored (obtained from search_calendar_events)."},"calendar_id":{"type":"string","description":"Optional
      ID of the calendar where the event is stored (from list_calendars or the Source
      ID in search results). Can be provided instead of calendar_url, and is required
      for Google calendars (''google:...'')."}},"required":["uid"]},"type":"function"},{"description":"During
      native voice, save useful text in this user''s Chat conversation and notify
