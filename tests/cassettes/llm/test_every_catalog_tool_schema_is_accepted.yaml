      URL to download from (YouTube, Vimeo, etc.)"},"audio_only":{"type":"boolean","description":"Download
      audio only (no video). Defaults to false.","default":false},"metadata_only":{"type":"boolean","description":"Extract
      metadata without downloading the file. Useful for getting video info first.","default":false}},"required":["url"]},"type":"function"},{"description":"Mock
      tool to simulate taking a camera snapshot. Generates and displays a mock camera
