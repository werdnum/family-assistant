      where to place the annotation text.","default":"top-left"}},"required":["image_attachment_id"]},"type":"function"},{"description":"Click
      at a specific coordinate on the screen.","name":"click","parameters":{"type":"object","properties":{"x":{"type":"integer","description":"X
