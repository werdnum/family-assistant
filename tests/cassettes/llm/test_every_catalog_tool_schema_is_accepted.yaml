      of the automation"},"automation_type":{"type":"string","enum":["event","schedule"],"description":"Type
      of automation"}},"required":["automation_id","automation_type"]},"type":"function"},{"description":"Permanently
      delete an automation","name":"delete_automation","parameters":{"type":"object","properties":{"automation_id":{"type":"integer","description":"ID
      of the automation"},"automation_type":{"type":"string","enum":["event","schedule"],"description":"Type
      of automation"}},"required":["automation_id","automation_type"]},"type":"function"},{"description":"Get
      execution statistics and recent history for an automation","name":"get_automation_stats","parameters":{"type":"object","properties":{"automation_id":{"type":"integer","description":"ID
      of the automation"},"automation_type":{"type":"string","enum":["event","schedule"],"description":"Type
      of automation"}},"required":["automation_id","automation_type"]},"type":"function"},{"description":"Lists
      all calendars available to the requesting user, including their IDs, friendly
      names, source type (CalDAV, iCal feed, or the user''s own Google calendars when
      their Google account is connected), and whether they are writable or read-only.
      Google calendar IDs start with ''google:'' (the user''s primary Google calendar
      is ''google:primary''). Use this to discover available calendars before searching
      with source filters or adding events to a specific calendar.","name":"list_calendars","parameters":{"type":"object","properties":{}},"type":"function"},{"description":"Adds
      a new event to a calendar: the default calendar unless calendar_id names another
